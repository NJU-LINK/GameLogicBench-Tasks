name: repo_td_income
kind: repo
press_semantics: true
description: >
  COMPOSED alloc task (bastion-line defense over a shared gold ledger). The controller runs TWO live
  systems from one on_tick(state) -> {"fire","buy_ammo","accept","produce"}: it aims the towers'
  fire at the light attackers (each shot spends AMMO bought with gold, bolts travel before they
  strike), and it runs the ARSENAL's siege-shell production queue (accepting orders charges gold up
  front, the serial build clock accumulates in world seconds, finished shells are released on their
  prefix-sum schedule and destroy the armoured heavies that bolts cannot). Gold is the single scarce
  pool: buying ammo and funding siege draw on the same purse, and each wave is tuned so it cannot
  fully fund both — the controller must read which segment threatens and spend accordingly. The
  judge asserts SATISFICING black-box bounds on world observables only (front/back enemies leaked
  at/under the scenario floor, ammo spent under a reference-relative budget, the gold ledger
  conserved, siege shells released on their serial schedule at legal spots). Every FAIL carries
  "broken_link" localising the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]

  focus_fire:
    press: {volley_split: focus_fire}
    seeds: [1, 2, 3]
  long_range:
    press: {flight_debt: long_range}
    seeds: [1, 2, 3]

  burst_enqueue:
    press: {production_queue: burst_enqueue}
    seeds: [1, 2, 3]
  cancel_mid:
    press: {production_queue: cancel_mid}
    seeds: [1, 2, 3]
  slow_tick:
    press: {production_queue: slow_tick}
    seeds: [1, 2, 3]

  overrun:
    press: {arm_or_build: overrun}
    seeds: [1, 2, 3]
  siege_wave:
    press: {arm_or_build: siege_wave}
    seeds: [1, 2, 3]

  overrun_x_split:
    press: {arm_or_build: overrun, volley_split: focus_fire}
    seeds: [1, 2, 3]
  siege_x_burst:
    press: {arm_or_build: siege_wave, production_queue: burst_enqueue}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
