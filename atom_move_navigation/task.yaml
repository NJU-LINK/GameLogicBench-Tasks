name: atom_move_navigation
kind: atom
description: >
  Behavior task (navigation): drive an enemy from its start to a goal through a walled 2D level
  without the enemy's body (a circle of given radius) hitting any wall, arriving before a time
  budget. The level CHANGES mid-run — a passage that starts open closes once the enemy advances —
  so a route computed once may become invalid. The controller returns a movement direction each
  physics frame (decide(state) -> Vector2); the judge integrates motion and checks behavior
  black-box (arrival / wall-collision / timeout), never reading the controller. Re-judged across
  hand-designed hidden scenarios × seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  door_shut:
    seeds: [1, 2, 3, 4, 5]
  multi_door:
    seeds: [1, 2, 3, 4, 5]
  pocket_door:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
