name: combo_alert_escalation_loop
kind: combo
description: >
  COMPOSED behavior task (a stealth guard's GRADED-ALERT loop) — a moving guard with a vision cone
  that must climb a non-symmetric alert ladder (idle -> suspicious -> aggro) and stand back down only
  with care. The load-bearing structure is the DE-ESCALATION CONJUNCTION GATE: a guard may drop toward
  idle only once it has calmed AND finished any search it owed, and once it has ENGAGED a quarry it
  stays primed until then. The controller reports {"move": Vector2, "alert": int} each frame; the judge
  maintains the AUTHORITATIVE suspicion meter and recomputes strict visibility + the geometric search
  obligation from the guard's body alone, and asserts the whole story black-box (zero internal-state
  reads). The ARMED axes are `search` (a last-known march commitment) and this combo's own graded-alert
  ESCALATION FSM — a state-read axis that lives only COUPLED with the structural-depth search axis
  (relock discipline + the conjunction gate). The suspicion meter, line-of-sight and navigation
  mechanisms run AMBIENT (their contracts are scored on every cell but armed by no cell — their
  attribution lives in their own atoms). Every FAIL carries "broken_link" (search | escalation |
  suspicion_meter | line_of_sight | move_navigation | engagement | return | completion). Re-judged
  across a baseline + hidden scenarios x seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  corner_slip:
    press: {search: corner_slip}
    seeds: [1, 2, 3, 4, 5]
  deep_hide:
    press: {search: deep_hide}
    seeds: [1, 2, 3, 4, 5]
  relock_bait:
    press: {search: deep_hide, escalation: early_calm_bait}
    seeds: [1, 2, 3, 4, 5]
  double_bait:
    press: {search: deep_hide, escalation: double_bait}
    seeds: [1, 2, 3, 4, 5]
  standdown_gate:
    press: {search: deep_hide, escalation: early_standdown}
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
