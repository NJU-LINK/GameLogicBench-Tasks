name: combo_duelist
kind: combo
description: >
  COMPOSED behavior task (one-on-one duel) — frame-level timing DEPTH. A stationary duelist faces
  one rival who dances in and out of reach and, depending on the world, counter-punches a swing
  thrown at the wrong moment, blocks with a raised guard, or demands a tight follow-up. The
  controller declares attack intents; every attack runs the windup -> active -> recovery lifecycle.
  Three armed frame-level disciplines sit on top of the lifecycle: a counterblow during YOUR windup
  CANCELS the swing (cancel), a hit thrown into a raised guard is PARRIED for no damage (guard), and
  once a hit lands the next must arrive inside a short link window or the assault breaks off (combo).
  Being struck staggers you (hitstun) and hits must clear the weapon cooldown (both ambient world
  rules). Every FAIL carries "broken_link" that localizes the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  active_frames:
    press: {active_frames: swift_pass}
    seeds: [1, 2, 3]
  guard:
    press: {guard: standing_guard}
    seeds: [1, 2, 3]
  combo:
    press: {combo: tight_link}
    seeds: [1, 2, 3]
  cancel:
    press: {cancel: counter_punch}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
