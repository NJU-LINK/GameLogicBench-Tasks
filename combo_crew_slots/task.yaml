name: combo_crew_slots
kind: combo
description: >
  COMPOSED behavior task (FTL-style crew dispatch on a corridor ship). A dispatch officer turns
  room-level orders into slot-level assignments: each room has a fixed set of docking slots and a
  CAPACITY (which may be smaller than its slot count); crew walk there continuously along a 1-D
  corridor; adjacent rooms are joined by DOORS that open only after a delay once someone approaches;
  and orders can change mid-run. The world integrates the walk, runs the door state machine and
  tracks slot occupancy authoritatively; the controller only decides which slot each crew member
  heads for. The judge drives one dispatch order to steady state and asserts the settled crew
  configuration black-box (no two crew on a slot, no room over capacity, nobody in the wrong room,
  nobody stranded in a corridor); every FAIL carries "broken_link" localizing the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  over_capacity:
    press: {over_capacity: waitlist}
    seeds: [1, 2, 3]
  slot_contention:
    press: {slot_contention: split_pair}
    seeds: [1, 2, 3]
  door_delay:
    press: {door_delay: late_doors}
    seeds: [1, 2, 3]
  reassign:
    press: {reassign: mid_reorder}
    seeds: [1, 2, 3]
  full_press:
    press: {over_capacity: waitlist, slot_contention: split_pair,
            door_delay: late_doors, reassign: mid_reorder}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
