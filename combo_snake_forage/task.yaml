name: combo_snake_forage
kind: combo
description: >
  Behavior task (snake forage: survival under accumulating self-commitment): drive a snake around a
  walled integer grid so it stays alive AND keeps eating. Each tick the judge hands the controller
  the arena size, the snake's cells (head first), the food cell and the current heading; the
  controller returns on_tick(state) -> a direction String ("up"/"down"/"left"/"right"). The judge
  advances the snake one cell (head moves, body follows, eating grows it and respawns food) and
  asserts black-box observables only: a DOUBLE lower bound -- the snake must still be alive at
  max_ticks AND have eaten at least K food. Running the head into the wall or its own body before
  the budget ends fails (self_trap / wall_crash); surviving the whole budget but under-eating fails
  (starve). Every cell the head passes through is an obstacle for the next L ticks (L = length), so
  the correct move is anti-greedy: the reactive shortest-path-to-food line coils the head into a
  pocket its own body has closed, whose exit only opens once the far tail vacates. Re-judged across
  hand-designed scenarios x seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  pocket_bait:
    press: {self_trap: pocket_bait}
    seeds: [1, 2, 3]
  tight_arena:
    press: {space_pressure: tight_arena}
    seeds: [1, 2, 3]
  long_haul:
    press: {endurance: long_haul}
    seeds: [4, 5, 12]
  bait_chain:
    press: {self_trap: bait_chain}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
