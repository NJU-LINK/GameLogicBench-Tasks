name: atom_hitbox
kind: atom
description: >
  Production-side task (hit-registration module; callee form): the game ships a beat-'em-up combat
  system that animates an attacker, drives a real Area2D "blade" hitbox through the world, and
  detects when a target body enters or leaves that hitbox — but the module that turns those contacts
  into HITS is unimplemented. The deliverable is that module: a stateful callee with
  setup(params) / resolve(swing, active, entered, exited)->Array. Each physics frame the game hands
  the module the target ids whose bodies fired the blade's body_entered / body_exited signals THIS
  frame (real engine signals; same-frame order not guaranteed), plus the swing id and the
  active-frame flag; the module returns the ids to register a hit on this frame. It must register
  each target the blade catches exactly once per swing (re-entry within a swing does not re-hit),
  only during the active frames (a wind-up brush does not count), register every same-frame entry
  (not just one), and reset the per-swing limit between swings. The judge drives the whole fight and
  scores the observable HIT-REGISTRATION stream against an independent ledger reconstructed from the
  real signals plus the active flag — never reading the module's internals: a second hit on a target
  already hit this swing FAILS (duplicate_register); a hit outside the active frames FAILS
  (inactive_register); a hit on a target that never entered while active FAILS (phantom_register); a
  target the blade clearly struck that is never registered FAILS (missed_hit). Contract fully
  disclosed (§8.4); the OOD axes are un-forewarned legal call patterns (same-frame multi-entry,
  re-entry, wind-up contact, repeated swings). Re-judged across hand-designed scenarios × seed
  perturbation.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  cleave:
    seeds: [1, 2, 3, 4]
  reentry:
    seeds: [1, 2, 3, 4]
  windup_contact:
    seeds: [1, 2, 3, 4]
  multi_swing:
    seeds: [1, 2, 3, 4]
