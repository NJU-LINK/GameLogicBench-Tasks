name: repo_turbofat_piece_phase
kind: repo
description: >
  REAL-REPO producer task (b — hollow-and-reimplement). The agent works inside "Turbo Fat", a Godot 4
  block-dropping puzzle game (MIT; upstream notes in README_UPSTREAM.md), and reimplements the PIECE
  PHASE ENGINE that drives the active piece through its life cycle — the phase state machine that
  spawns a piece, hands it to the player, holds it for its lock-commit window, writes it into the
  playfield, waits out the playfield's animations and schedules the next spawn, plus the PieceManager
  that carries the phases' state (the lock counter, the piece object's lifetime, the input buffer
  forwarding, the spawn delay). The upstream ships everything the engine talks to — piece geometry and
  rotation kicks, gravity, the mover / rotator / dropper / squisher physics nodes, the piece queue, the
  playfield with its line clearer and box builder, the 34-rung speed table with every frame count in
  it, the frame-input buffer with its timer, the state machine base class, and the whole scene wiring
  with its 57 connections (19 of them callbacks the engine must provide) — ALL INTACT, including one sibling phase script (res://src/main/puzzle/
  top-out.gd) left whole as a worked example of the State protocol. Only piece-manager.gd,
  piece-states.gd and the six scripts under piece/states/ are hollowed to stubs. The behavior contract
  (whether the lock-commit phase keeps driving the piece physics and what happens when the commit is
  withdrawn, and where in the phase cycle player input is recorded and replayed so a tap survives
  across a spawn) is NOT in the README — it must be reconstructed from the intact surrounding code
  (the reading wall). The judge builds real levels out of level settings the game itself supports
  (speed rung, piece-type pool, starting blocks, prerecorded input script), boots the game's own
  Puzzle scene with the delivered engine in place, and asserts BLACK-BOX on world observables only —
  the 9x20 playfield's tile occupancy and the lines / pieces counters, at exact physics-frame stamps —
  never on the phase machine, the active piece, the engine's own tile map or any signal it emits.
  Every FAIL carries a broken_link localising the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  lock_cancel:
    seeds: [1, 2, 3]
  squish_escape:
    seeds: [1, 2, 3]
  buffer_spawn:
    seeds: [1, 2, 3]
  buffer_move:
    seeds: [1, 2, 3]
  escape_x_buffer:
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://src/main/puzzle/piece/states/prelock.gd
    - res://src/main/puzzle/piece/piece-manager.gd
    - res://src/main/puzzle/piece/piece-states.gd
    - res://src/main/puzzle/piece/states
  resources:
    cpus: 1
    memory: 4g
    pids_limit: 1024
  timeout:
    container: 420
    kill_after: 15
    wall: 480

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048
