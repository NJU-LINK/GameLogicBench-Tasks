name: atom_keeper_arc
kind: atom
description: >
  Behavior task (goalkeeping: angle coverage / interpose under shot fakes): drive a goalkeeper —
  a speed-capped circle confined to a box in front of its goal — through a deterministic attack
  drill. Each physics frame the judge feeds the controller the world state (keeper pose/speed/box,
  both posts, ball position+velocity, attacker position/facing/phase) and the controller returns
  on_tick(state) -> {"move": Vector2} (unit-capped move intent; the keeper can never teleport).
  The judge authoritatively drives the attacker through dribble/wind-up/strike events — wind-ups
  are sometimes pulled back (shot fakes, aim readable from shooter_facing) before the true strike,
  which may target the opposite post — and flies each struck ball as a flat straight drive,
  ruling a SAVE when keeper body meets ball (continuous per-frame closest approach, no tunnelling)
  and a GOAL when the ball crosses the line inside the mouth. Black-box observable only: at least
  (shots - 1) shots kept out. Re-judged across hand-designed hidden scenarios x seed perturbation
  — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  wide_sweep:
    seeds: [1, 2, 3, 4, 5]
  feint_switch:
    seeds: [1, 2, 3, 4, 5]
  double_pump:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
