name: repo_youtd2_projectile_engine
kind: repo
description: >
  REAL-REPO producer task (b 挖空重实现). The agent works inside YouTD 2 (MIT code, Godot 4.4
  native, ~735 .gd — the largest codebase in the pool), a finished lockstep-deterministic tower-
  defense game, and rebuilds its PROJECTILE FLIGHT / COLLISION / LIFECYCLE ENGINE:
  res://src/projectiles/projectile.gd (class_name Projectile extends DummyUnit, 882 lines upstream).
  Almost everything a tower or an item does to a creep travels there as a projectile — the object
  that leaves the tower, flies, arrives and reports back — and 214 tower-behavior and item-behavior
  scripts (78 .gd files reference Projectile) are its callers. Thirteen mechanic-bearing methods are
  excavated to behavior-visible stubs: the per-tick driver update(), the two movers _update_normal()
  (collision -> range -> turning -> rotation -> acceleration -> displacement -> z -> homing contact,
  a seven-stage fixed order) and _update_interpolated() (progress accumulation, arrival, avert
  reentry double-check), the collision ledger _collide_with_units(), the turn-rate limiter
  _turn_towards_target(), the expiration path _expire(), the three callbacks
  _on_periodic_timer_timeout() / _on_target_tree_exited() / _on_lifetime_timer_timeout(), and the
  four setters consumers call mid-flight — disable_periodic(), enable_periodic(),
  set_collision_parameters(), set_collision_enabled(). The surrounding scaffolding (the constant
  block, every field declaration, @export node refs, _ready() including _spawn_time =
  Utils.get_time(), the public aim/interpolation entry points, the private movement-setup and
  visual helpers, the remaining getters/setters, and the whole static create*() factory family
  including the periodic-countdown assembly and the lifetime gate) stays as frozen given code, and
  so does the rest of the tree — crucially projectile_type.gd (the configuration surface whose
  docstrings are this task's evidence wall), projectile.tscn, unit.gd, dummy_unit.gd, tower.gd,
  game_client.gd, manual_timer.gd and all 214 behavior scripts. What is tested is the L2 projectile
  contract — the five mutually exclusive termination paths (travelled the range / lifetime ran out /
  homing contact / destroy-on-collision / physics ground impact, each calling a different callback,
  behind one idempotent cleanup), the null-target inheritance when the chased unit dies mid-flight
  (freeze the last known position, keep flying, fire the arrival callback with a null target), the
  periodic-callback gate and its phase carry-over, and the per-unit collision ledger. CSV numbers
  (projectile speeds, ranges, radii, periods) and the routing/ownership rules are a READING WALL
  (L3 difficulty source), never spelled out. The judge instantiates the real game_scene.tscn, drives
  a fixed judge-authoritative build (research element -> build a projectile-flying tower roster),
  runs full matches with unlimited_portal_lives so leak never ends a match, and asserts BLACK-BOX on
  world-observable projectile behavior: it connects every creep's damaged signal through the
  engine-level SceneTree.node_added hook and reconstructs, from the (tower, creep, channel, tick)
  quadruple alone, structural invariants only — per-pair window event counts, event-burst sizes,
  hit-yield ratios and binary liveness. It never reads a Projectile instance's members or position.
  Scoring never reads lives/waves-cleared. Public baseline uses a single piercing tower on default
  creep health so the naive stays correct; hidden scenarios arm a piercing projectile that crosses
  the whole creep line / a projectile that recursively splits when it finishes its range / a chasing
  projectile whose target dies mid-flight / a carried projectile that runs its own beat as
  UNANNOUNCED-BUT-LEGAL calling patterns (each = a different frozen consumer's legal configuration),
  three of them arming exactly one contract family and drake_cycle arming three (intrinsically
  coupled cell).

scenarios:
  baseline:
    seeds: [1, 2, 3]
  pierce_ledger:
    seeds: [1, 2, 3]
  expiry_split:
    seeds: [1, 2, 3]
  home_chase:
    seeds: [1, 2, 3]
  drake_cycle:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 300
    kill_after: 15
    wall: 330
  deliverable_paths:
    - res://src/projectiles/projectile.gd

solve:
  resources:
    cpus: 4
    memory: 12g
    pids_limit: 2048
