name: repo_worldwarii_conquest
kind: repo
description: >
  REAL-REPO integration task (WW2 grand-strategy, the "conquest" strategic layer of WorldWarII
  by Fischer-Zhang, MIT code + assets, Godot 4.4, ~44 .gd). The agent implements the campaign
  HIGH COMMAND: a res://logic/ planner that each turn reads state["conquest"] (every region's
  owner / strength / production / fortification / supply status / garrison, the shared research
  pool, tech levels, and the unit/tech/general catalogs) and returns an order sequence -- what
  each region recruits, develops (industry / fortification / logistics / training), which
  technologies high command researches, which generals command which units, how regions prepare
  and launch attacks. The campaign applies the orders through the game's OWN conquest rules
  (ConquestManager / ConquestRecruit / ConquestSupply / LoungeManager) and runs the enemy phase.
  What is being tested is READING AND INTEGRATING WITH THE REAL STRATEGIC LAYER: strength is a
  PER-REGION local pool (never transferred), income is gated by a multi-source Dijkstra SUPPLY
  network (rail/port cost 1, road cost 2, cut beyond cost 6 -> production/4 instead of /2),
  advanced units are TECH-GATED behind a shared research pool, development costs scale and cap,
  and a general's / researched tech's bonuses fold into a unit's combat power -- conventions
  spread across five source files with no single spec. The tactical hex battle is BLACK-BOXED by
  a deterministic auto-resolve model (auto_resolve.gd, disclosed to the agent as a campaign rule
  so attacks can be reasoned about); the strategic layer (income / supply / AI-vs-AI occupation /
  player defence / turn advance) runs through the game's native end_turn. The SCORED contract is
  COMMAND LEGALITY (the reading-the-engine discipline as an independent assertion): a high command
  that has read the strategic layer never commands a region it does not own, nor attacks/transfers
  to a non-adjacent (or unowned) target -- ownership and adjacency are handed to the planner in the
  turn snapshot, so a structurally-impossible order is a pure misread of the runtime, its own FAIL
  signature (broken_link = command_legality) ahead of any campaign result. Over-queuing against a
  shrinking strength/point budget is the engine's documented fire-and-forget idiom (illegal orders
  are silently skipped) and is deliberately NOT scored. The black-box discrete strategic MILESTONES
  (nation survives to the deadline; a target region is captured; a minimum count of regions stays
  SUPPLIED) are the VALIDITY GATE behind that contract -- never strength knife-edges. The
  conquest layer is RNG-free, so runs are bit-identical; the seed only perturbs safe numeric
  bands (rear-region starting strength). Scenario axis = held-out pressure world (supply-cut
  theatre / fortified tech-gated objective) x seed.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  sever_relief:
    seeds: [1, 2, 3, 4, 5]
  armored_gate:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 960
    height: 600
