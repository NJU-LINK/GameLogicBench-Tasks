name: repo_rts_engagement_chain
kind: repo
description: >
  REAL-REPO producer task (round-19, b form: hollow-and-reimplement). The agent works inside Open
  RTS (Lampe Games, MIT code + Kenney CC0 3D art, Godot 4.4) -- a complete real-time strategy match
  with workers, a two-currency economy, production queues, two-stage construction, and ranged combat.
  The upstream ships a complete unit ENGAGEMENT chain; the task version HOLLOWS it out and the agent
  reimplements it from a work-order spec. The deliverable is the four actions every armed unit runs:
    res://source/match/units/actions/WaitingForTargets.gd        -- the resting state: scan on a
        cadence for attackable enemies within sight_range, acquire the nearest, hold the scan while
        a fight is on, resume when it ends
    res://source/match/units/actions/AutoAttacking.gd            -- the attack order: fight the
        target while it is in attack_range, otherwise approach it first; re-decide on every
        sub-action end until the target is gone
    res://source/match/units/actions/AttackingWhileInRange.gd    -- the in-range fight: fire the
        unit's projectile on the unit's attack cooldown -- an ABSOLUTE game-time deadline living on
        the UNIT that survives any action teardown/rebuild and keeps running out of combat
    res://source/match/units/actions/FollowingToReachDistance.gd -- the approach: walk toward the
        (possibly moving) target until within the requested distance, re-pathing as it moves
  What is tested is IMPLEMENTING A REAL ENGAGEMENT ENGINE: a cooldown ledger that must survive three
  different action-rebuild triggers (a re-issued order, the chase hand-off, the target's death), a
  commitment lock (no target re-scan mid-fight), and the acquire/hold/chase radius discipline -- on
  top of the real Match scene, real NavigationServer navigation and real physics avoidance. The
  judge is the COMMANDER: it builds the real Match on PlainAndSimple with two plain Players, spawns
  an armed attacker + enemy victims through the game's OWN paths, lets the engagement drive ITSELF
  (combat units mount WaitingForTargets on _ready), and intervenes only through the game's OWN verbs
  (re-order = the human right-click AutoAttacking commit, a Moving detour, a teleport, a unit
  spawn). It asserts BLACK-BOX on world-observable quantities only (MatchSignals.unit_damaged
  frames + victim hp trajectories, projectile spawn frames via the engine's child_entered_tree,
  and distances the judge recomputes itself) -- never on the actions' internals (the "reads the
  module through the world" rule).

scenarios:
  baseline:
    seeds: [1, 2, 3]
  sustained_cadence:
    press: {attack_clock: sustained_cadence}
    seeds: [1, 2, 3]
  rocket_cadence:
    press: {attack_clock: rocket_cadence}
    seeds: [1, 2, 3]
  order_churn:
    press: {attack_clock: order_churn}
    seeds: [1, 2, 3]
  broken_reentry:
    press: {attack_clock: broken_reentry, pursuit_acquire: broken_reentry}
    seeds: [1, 2, 3]
  closer_intruder:
    press: {engagement_commit: closer_intruder}
    seeds: [1, 2, 3]
  target_death_handover:
    press: {engagement_commit: target_death_handover}
    seeds: [1, 2, 3]
  flee_chase:
    press: {pursuit_acquire: flee_chase}
    seeds: [1, 2, 3]
  standoff_acquire:
    press: {pursuit_acquire: standoff_acquire}
    seeds: [1, 2, 3]
  turret_watch:
    press: {pursuit_acquire: turret_watch}
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://source/match/units/actions/WaitingForTargets.gd
    - res://source/match/units/actions/AutoAttacking.gd
    - res://source/match/units/actions/AttackingWhileInRange.gd
    - res://source/match/units/actions/FollowingToReachDistance.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 1920
    height: 1080
