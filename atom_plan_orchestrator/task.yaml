name: atom_plan_orchestrator
kind: atom
description: >
  Goal-driven action orchestrator (caller form): a keeper survives an aspatial, continuously ticking
  survival micro-world. The controller returns ONE action each tick (chop_wood / build_firepit /
  gather_food / flee / idle); the judge OWNS the world loop — it decays needs, advances the chosen
  durative action, resolves effects on completion, and injects UNFOREWARNED mutations (a resource
  delivery + tree closure, a swinging goal priority, a permanently sealed resource, a threat with a
  countdown) at times never disclosed. PASS requires driving the whole episode with none of the
  orchestration invariants broken and the keeper alive (warmth>0, hunger<100).

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  resource_race:
    seeds: [1, 2, 3]
  priority_flip:
    seeds: [1, 2, 3]
  sealed_goal:
    seeds: [1, 2, 3]
  commit_early:
    seeds: [1, 2, 3]
  commit_late:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
