name: atom_target_selection
kind: atom
description: >
  Behavior task (targeting: threat-ranking + hysteresis debounce): drive a stationary boss sentinel
  to keep its weapon LOCKED onto the most threatening of several hostile targets while the fight
  evolves. Each physics frame the controller returns an INTENT (on_tick(state) -> {"target":
  target_id}) naming the target it keeps locked. The judge scripts each target's threat over time (a
  piecewise-constant base level that shifts at set frames, plus a per-target sinusoidal wobble) and
  asserts black-box observables only (the declared lock id sequence vs the world's threat levels),
  never reading the controller: a lock that is clearly off the top threat (outside a short reaction
  window after each shift) FAILS (wrong_target); a lock that flickers between targets more than a
  small budget of switches FAILS (target_thrash); an invalid/absent lock FAILS. Holding a near-top,
  steady lock for the whole fight PASSES. The functional need to debounce (avoid re-picking on tiny
  wobble) is stated in the brief; the lock-check tolerances sit in the sim_core twin like any
  assertion tolerance, but the load-bearing secret is the THREAT SCRIPT — how close the top targets
  sit and how often the fight shifts is never described to the agent (game/level.gd builds only the
  baseline layout). Re-judged across hand-designed scenarios × seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  close_contest:
    seeds: [1, 2, 3, 4, 5]
  ramp_cross:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
