name: repo_amsg_movement_engine
kind: repo
description: >
  REAL-REPO producer task (b — hollow-and-reimplement). The agent works inside AMSG (Advanced
  Movement System Godot), a Godot 4 third-person character kit (MIT; upstream notes in
  README_UPSTREAM.md) — a real skeletal rig with its animation blender, camera component, stair
  sensor, mantling and pose-warping addons, ALL INTACT — and reimplements the CHARACTER MOVEMENT
  ENGINE: the one component whose state every other part of the rig consumes
  (res://addons/AMSG/Components/CharacterMovementComponent.gd, hollowed to a 570-line-upstream
  stub keeping every export, neighbour-read variable and method signature). The behaviour contract
  (the rotation_mode x stance movement-data matrix hot-swapped by property writes, the per-call
  speed supply that must not persist, the fall-confirmation window, the head-blocked crouch gate,
  the travel-direction stair sensor) is NOT in the README — it must be reconstructed from the
  frozen consumers and the rig scene (the reading wall). The judge builds a minimal world around
  the UPSTREAM rig scene, drives the delivered component exactly like the game's own
  PlayerController (per-step add_movement_input calls picked from the agent's gait +
  current_movement_data, zero calls on release, property writes, jump()) and asserts BLACK-BOX on
  world observables only — position/velocity trajectories, the capsule height on the frozen
  collision shape, the InAir parameter rewritten every step by the frozen animation blender, and
  geometric event frames recomputed from the trajectory. Every FAIL carries a broken_link
  localising the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  mode_matrix:
    seeds: [1, 2, 3]
  supply_gap:
    seeds: [1, 2, 3]
  gap_hop:
    seeds: [1, 2, 3]
  ledge_drop:
    seeds: [1, 2, 3]
  ceiling_lock:
    seeds: [1, 2, 3]
  stair_x:
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://addons/AMSG/Components/CharacterMovementComponent.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 300

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048
