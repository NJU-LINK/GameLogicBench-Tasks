name: combo_tactics_turn
kind: combo
description: >
  COMPOSED behavior task (grid-tactics AI turn). You command a small squad on a walled grid; the
  controller drives your whole turn ONE action at a time, and the world executes each action before
  asking again — a move can free or block a cell the next action needs. Enemies never move during
  your turn; they only strike back when hit and left alive. The emergent-correct turn is a global
  greedy loop recomputed from the CURRENT board each step: concentrate a scarce shared attack budget
  to secure the kills you can (fewest-hits target first), route around allies you just moved, never
  feed a unit to a lethal retaliator you cannot kill, keep every step clear of a live enemy's zone of
  control, retreat any unit out of a disengage-bite range before ending, and END when no positive
  progress remains (which also bounds the turn). The judge drives one full turn and asserts per-action
  legality plus the emergent CONSEQUENCE LOWER BOUNDS (enough kills, no unit lost, bounded
  termination) black-box — never a unique action sequence, since the optimal turn is not unique.
  Every FAIL carries "broken_link" localizing the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  kill_priority:
    press: {kill_priority: focus_budget}
    seeds: [1, 2, 3]
  replan_path:
    press: {replan_path: ally_block}
    seeds: [1, 2, 3]
  suicide_guard:
    press: {suicide_guard: lethal_counter}
    seeds: [1, 2, 3]
  livelock:
    press: {livelock: sealed_target}
    seeds: [1, 2, 3]
  full_press:
    press: {kill_priority: focus_budget, replan_path: ally_block, suicide_guard: lethal_counter, livelock: sealed_target}
    seeds: [1, 2, 3]
  solver_blowup:
    press: {kill_priority: focus_budget}
    seeds: [1, 2, 3]
  threat_zone:
    press: {threat_zone: overwatch}
    seeds: [1, 2, 3]
  kite_retreat:
    press: {kite_retreat: disengage_bite}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
