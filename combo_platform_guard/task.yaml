name: combo_platform_guard
kind: combo
description: >
  COMPOSED behavior task (platform guard) — the eighth combo, closing the platformer line:
  three calibrated atoms (patrol + ledge detection, line-of-sight perception, jump landing)
  plus the chase/return orchestration between them (patrol -> spot -> cross-platform pursuit
  -> lose -> return home), with NO new mechanics and NO new tolerances. The guard is a real
  CharacterBody2D (gravity + move_and_slide + gated jump, atom_jump_landing's physics); each
  frame the controller returns {"move", "jump", "chasing"} and the judge recomputes the
  authoritative visibility truth from the guard's CURRENT position (atom_line_of_sight's
  range band + 3-ray bundle, gray zones included) and asserts the full guard story black-box.
  Falling off the world at ANY phase is a FAIL, attributed by phase (walked off while
  patrolling = patrol_edge; crashed mid-pursuit-jump = jump_landing). Every FAIL carries
  "broken_link" (patrol_edge | line_of_sight | jump_landing | guard | completion). Re-judged
  across a baseline scenario and hand-designed hidden scenarios (one armed axis each) x seed
  perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  patrol_edge:
    press: {patrol_edge: shifted_ledge}
    seeds: [1, 2, 3, 4, 5]
  line_of_sight:
    press: {line_of_sight: wall_between}
    seeds: [1, 2, 3, 4, 5]
  jump_landing:
    press: {jump_landing: wide_gaps}
    seeds: [1, 2, 3, 4, 5]
  guard:
    press: {guard: single_visit}
    seeds: [1, 2, 3, 4, 5]
  dual_visit:
    press: {guard: dual_visit}
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
