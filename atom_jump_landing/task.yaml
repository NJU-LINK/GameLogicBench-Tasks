name: atom_jump_landing
kind: atom
description: >
  Physics task (platform jumping): drive a character from the start platform to a target platform
  by jumping across a gap. The character must land on the target platform (is_on_floor and within
  the platform's x-span) and stay there for at least 10 consecutive frames before the frame budget
  expires. The controller returns a move intent (float) and jump intent (bool) each frame; the judge
  runs real CharacterBody2D physics with gravity and move_and_slide. The key trap is position-aware
  jump timing: the launch point must be derived from the ballistic range R(height_diff) — jumping
  from the platform center is too short for wide_gaps, while walking to the right edge with a
  constant lead overshoots the near/narrow staggered_heights goals.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  wide_gaps:
    seeds: [1, 2, 3, 4, 5]
  staggered_heights:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
