name: repo_ftl_weapon_charge
kind: repo
description: >
  REAL-REPO producer task (b 挖空重实现). The agent works inside GDQuest's 2D Tactical Space Combat
  (MIT code AND art, Godot 3.2 upstream ported to 4.4 native, 31 .gd / 23 .tscn), a finished
  FTL-style ship duel — two ships with tiled rooms, crew that walk, per-room oxygen, spreading fires
  and hull breaches, doors, a shield bubble, targeting UI, win/lose flow — and rebuilds its WEAPON
  CHARGE / FIRE LAYER: the four device scripts under res://TacticalSpaceCombat/Ship/Weapons/
  (Weapon.gd 44 lines, WeaponProjectile.gd 44, WeaponLaser.gd 49, LaserTracker.gd 93; 230 lines, of
  which ~120 carry mechanism). This is the layer that charges a weapon over time, decides whether it
  may fire right now, throws a projectile carrying a damage payload, and drags a laser beam across
  the enemy hull step by step. Four mechanic-bearing regions are excavated to behavior-visible stubs
  (Weapon._ready/set_is_charging/set_modifier — the charge state machine and the modifier speed
  change; WeaponProjectile.fire/can_fire — the fire gate, the muzzle shot and its payload;
  WeaponLaser._ready/fire/can_fire — the beam timer wiring and the beam gate; LaserTracker.
  _on_Weapon_fire_started/_on_Weapon_fire_stopped/_swipe_laser — the sweep geometry and the shield
  clip); the surrounding scaffolding (class headers, MIN_CHARGE/MAX_CHARGE, every @export/@onready/
  signal, both setup() bodies, _get_configuration_warnings, LaserTracker._unhandled_input and
  _on_Controller_targeting) stays as frozen given code, and the five Controller*.gd files plus all
  27 other scripts, 23 scenes and 8 resources are FROZEN — the judge overlays authoritative copies of
  all of them. What is tested is the L2 weapon-layer contract: a charge that completes while the
  weapon has no target must be KEPT (so the next target order fires on the very same frame, without
  restarting the clock), and a sweeping beam's damage point must be clipped against the CURRENTLY
  powered shield polygon every step. The judge instantiates the real TacticalSpaceCombat.tscn, plays
  the player through frozen entry points only (a room emitting `targeted`, a weapon button being
  re-armed, a Controller emitting `targeting`, Shield.set_powered, crew moved between rooms) and
  asserts BLACK-BOX on world-observable events read off FROZEN nodes: incoming shots appearing in the
  enemy ship's Projectiles node, beam areas entering room Area2Ds, fire/breach landings, per-room
  oxygen, hull hitpoints. Scoring never reads the weapon's own signals or its _charge. Public
  baseline uses one target order and no lasers (all seven single-defect variants are bit-identical
  there); hidden scenarios arm held-charge re-targeting / a mid-match shield window / in-flight
  re-aiming / crew shuffling as UNANNOUNCED-BUT-LEGAL calling patterns, each arming exactly one
  contract family (coupled_hold_shield arms two: charge_hold + beam_shield_clip, per-axis double
  probe).

scenarios:
  baseline:
    seeds: [1, 2]
  hold_recharge:
    seeds: [1, 2, 3]
  shielded_sweep:
    seeds: [1, 2, 3]
  retarget_inflight:
    seeds: [1, 2, 3]
  crew_shuffle:
    seeds: [1, 2, 3]
  coupled_hold_shield:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270
  deliverable_paths:
    - res://TacticalSpaceCombat/Ship/Weapons/Weapon.gd
    - res://TacticalSpaceCombat/Ship/Weapons/WeaponProjectile.gd
    - res://TacticalSpaceCombat/Ship/Weapons/WeaponLaser.gd
    - res://TacticalSpaceCombat/Ship/Weapons/LaserTracker.gd

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 1920
    height: 1080
  timeout:
    container: 480
    kill_after: 20
    wall: 540
