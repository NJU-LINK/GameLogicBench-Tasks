name: atom_move_slide_3d
kind: atom
description: >
  Physics task (3D character movement over terrain): drive a CharacterBody3D from the start to a
  goal region through a corridor that may be crossed by obstacles. Every physics frame the controller
  sees the character's pose, velocity, ground/wall contact flags and contact normals, and the goal,
  and returns decide(state) -> {"move": Vector3 horizontal heading, "jump": bool}. The judge steps the
  real physics (move_and_slide with gravity; a jump only takes effect while is_on_floor) and asserts
  black-box: standing on the goal (on the floor, within goal_radius) for a short dwell PASSES;
  wedging at an obstacle until the budget expires FAILS (never_arrived, traverse); dropping out of
  the world FAILS (fell, traverse). The mechanism is contact-geometry terrain response, not
  ballistics: a knee-high step reads as a wall (move_and_slide has no auto step-up, so it must be
  JUMPED), a tall wall must be STEERED around its side opening, and walking off a low edge opens a
  window where is_on_floor AND is_on_wall are BOTH false (so blocked-detection must read the actual
  velocity). The terrain_chain scenario chains these into a single corridor and adds that the wall
  opening is not always on the same side: it SWITCHES between the two walls, so the steer side must be
  READ from the situation, not hardcoded.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  step_wall:
    seeds: [1, 2, 3]
  tall_wall:
    seeds: [1, 2, 3]
  stair_descent:
    seeds: [1, 2, 3]
  terrain_chain:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 720
    height: 540
