name: atom_move_navigation_3d
kind: atom
description: >
  Navigation task (3D routing through split ground): drive an agent from the start to a goal region
  across a 3D level whose ground may be split into separate pieces (a chasm between platforms, or
  ledges stacked at different heights) that are joined only by connectors (NavigationLink3D jump-gaps
  / bridges). Every physics frame the controller sees the agent's position, the goal, and a handle to
  the current navigation map (which reflects the platforms AND the connectors), and returns
  decide(state) -> Vector3 heading. The judge moves the agent kinematically along the clamped heading
  and asserts black-box: reaching within goal_radius PASSES; the frame budget expiring without
  arriving FAILS (never_arrived, route); leaving the walkable region — out over a gap that is neither
  a platform nor a connector — FAILS (left_region, route). The task presses TWO faces of routing: (a)
  static spatial-connectivity topology (multi-level ground reachable only via connectors, which a
  same-plane 2D grid A* cannot express); and (b) mid-run dynamic re-planning — on the hidden bridge_cut
  courses a connector the agent is heading for is disabled while the run is in progress (the map
  re-syncs to route around it), so a controller that caches its first route drives onto the now-dead
  bridge and leaves the region, while a robust one detects the stale route and re-plans over the
  detour. A controller that heads straight at the goal walks off into a chasm; the route must consult
  the (current) navigation map and keep following the world as it stands.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  split_ledge:
    seeds: [1, 2, 3]
  chain_bridge:
    seeds: [1, 2, 3]
  detour_pocket:
    seeds: [1, 2, 3]
  bridge_cut:
    seeds: [1, 2, 3]
  bridge_cut_chain:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 720
    height: 540
