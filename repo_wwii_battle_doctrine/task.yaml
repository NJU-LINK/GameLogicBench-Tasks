name: repo_wwii_battle_doctrine
kind: repo
description: >
  REAL-REPO producer task (round-12, b form: hollow-and-reimplement). The agent works inside
  WorldWarII (Fischer-Zhang, MIT code + art, Godot 4.4) -- a turn-based tactical hex wargame with a
  strategic conquest layer on top. The upstream ships a complete TACTICAL ENGAGEMENT engine; the task
  version HOLLOWS it out and the agent reimplements it from a work-order spec. The deliverable is the
  three files the battle screen calls into every time two units fight:
    res://scripts/combat/combat_resolver.gd    -- resolve() one attack: HP-scaled damage, the halved
        counter-attack (gated on range / indirect / survival), the suppression + dig-in it inflicts,
        packed into a six-field Result the caller applies to the world.
    res://scripts/combat/combat_effects.gd     -- the suppression ledger (clamp 0..5, per-type +
        indirect floor, turn decay, rally), the morale/rout state machine (a pool seeded from rank,
        drained by pressure minus a resistance modulated by adjacency / pinned / dig-in / terrain,
        routing at 0 and reforming at half out of reach), splash (round) & overwatch (ceil) falloff,
        dig-in erosion, and every tuning constant.
    res://scripts/combat/overwatch_resolver.gd -- reaction fire: as a mover walks a path, each enemy
        watcher that is on overwatch AND sees the step AND has it in range fires ONCE, with its own
        suppression penalty folded in; truncates the move if the mover dies.
  What is tested is IMPLEMENTING A REAL TACTICAL ENGAGEMENT ENGINE across four heterogeneous system
  axes -- spatial reaction fire, a suppression/morale state machine, a conservation ledger, and
  turn-phase scheduling -- that couple through shared world quantities (suppression feeds morale and
  shaves overwatch; overwatch geometry feeds the ledger; adjacency + pinned jointly break morale). The
  judge is the COMMANDER: it injects a fixed controlled scenario into DataLoader/GameState, boots the
  REAL scenes/battle.tscn headless (battle.gd self-assembles hex_map / units / factions / turn manager
  / visibility from the scenario), forces every faction player-controlled to keep the AI from stepping,
  and replays a fixed action SCRIPT through the game's OWN verbs (battle._resolve_attack,
  OverwatchResolver.trigger_along_path, the turn-boundary settlement). It asserts BLACK-BOX on
  move-independent world-observable quantities only (per-unit hp / suppression / morale / routed /
  dig_in / on_overwatch, and the overwatch (watcher,hex,dmg) fire events) -- recomputed by an
  INDEPENDENT oracle (oracle_combat.gd), never the module's return values (the "reads the module
  through the world" rule).

scenarios:
  baseline:
    seeds: [1]
  overwatch_gauntlet:
    seeds: [1]
  counter_edge:
    seeds: [1]
  wounded_standoff:
    seeds: [1]
  focus_fire_rout:
    seeds: [1]
  pin_ladder:
    seeds: [1]
  recovery_phase:
    seeds: [1]
  suppressed_overwatch:
    seeds: [1]
  ganged_pin_break:
    seeds: [1]
  rout_reform:
    seeds: [1]

judge:
  deliverable_paths:
    - res://scripts/combat/combat_resolver.gd
    - res://scripts/combat/combat_effects.gd
    - res://scripts/combat/overwatch_resolver.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 1280
    height: 720
