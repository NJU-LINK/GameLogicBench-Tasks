name: repo_slayrobot_action_stack
kind: repo
description: >
  REAL-REPO producer task (b — hollow-and-reimplement). The agent works inside "Slay the Robot", a
  Godot 4 Slay-the-Spire-style deckbuilder framework (MIT; upstream notes in README_UPSTREAM.md), and
  reimplements the ACTION SCHEDULER — the singleton the whole game hands its work to. Almost
  everything in this framework is an action object (an attack, a block, a card draw, a shuffle, a
  status application, a shop purchase, ending a turn, generating the world), and one singleton
  receives them, decides in what order and at what pace they run, lets an action hand it more work
  while that action is itself running, waits for asynchronous actions to finish, and keeps the
  per-combatant record of which action interceptors are currently registered. The upstream ships
  everything around it intact: the ~90 concrete action scripts, the interceptor chain that reads the
  registry, the combat screen and its turn clock, the card play pipeline, the hand and pile manager,
  the attack / draw generators that call back into the scheduler from inside their own actions, and
  roughly eighty call sites across the repo. Only eleven method bodies of res://autoload/ActionHandler.gd
  are hollowed to a stub (~120 lines: the two hand-over entry points, the drain loop, the
  async-action teardown, the full clear, the three interceptor-registry methods and the three
  lifecycle handlers); the field declarations, the actions_ended signal and _ready() (the three
  Signals connections plus the pausable action_timer setup) ship intact. The behaviour contract (what
  the two hand-over flags mean in each of the three states the scheduler can be in, what happens to
  work handed over from inside a running action or while an asynchronous one is in flight, and which
  of combat-end / player-death / run-end clears which subset of state) is NOT in the README — it must
  be reconstructed from the intact surrounding code (the reading wall). The judge builds a real battle
  out of the game's own Player / Enemy / BaseAction / interceptor classes, drives the delivered
  scheduler through its declared interface, and asserts BLACK-BOX on world observables only — the
  order in which real action objects actually ran, real combat numbers off the frozen combatants, and
  whether the frozen auto-revive interceptor still fires — never on the singleton's containers. Every
  FAIL carries a broken_link localising the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  enqueue_matrix:
    seeds: [1, 2, 3]
  reentrant_chain:
    seeds: [1, 2, 3]
  lifecycle_asymmetry:
    seeds: [1, 2, 3]

record:
  window:
    width: 1200
    height: 700

judge:
  deliverable_paths:
    - res://autoload/ActionHandler.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 300

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048
