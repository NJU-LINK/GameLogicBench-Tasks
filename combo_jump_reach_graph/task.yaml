name: combo_jump_reach_graph
kind: combo
description: >
  COMPOSED physics task (multi-hop ballistic reachability GRAPH x runtime graph mutation): drive a
  climber across a field of stone ledges to the goal ledge and stay on it for 10 consecutive frames
  without ever falling out of the world. Each hop is a real CharacterBody2D jump under constant
  gravity, so whether ledge B can be reached from ledge A is decided by the ballistic envelope of
  the launch surface -- a horizontal bound that depends on the height difference, plus a hard
  vertical bound (a ledge more than the jump's apex above you is unreachable at ANY horizontal
  distance). The field contains ledges that cannot be reached, ledges that can only be jumped DOWN
  to and never back up from, and ledges that give way during play. The controller returns a move
  intent (float) and a jump intent (bool) each frame; state carries the CURRENT set of ledges.
  Re-judged across hand-designed scenarios x seed perturbation. Every FAIL carries "broken_link" =
  the failing axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  overrange_decoy:
    press: {reach_envelope: overrange_decoy}
    seeds: [1, 2, 3]
  high_decoy:
    press: {reach_envelope: high_decoy}
    seeds: [1, 2, 3]
  dead_end_lure:
    press: {route_graph: dead_end_lure}
    seeds: [1, 2, 3]
  asym_edges:
    press: {route_graph: asym_edges}
    seeds: [1, 2, 3]
  bridge_out:
    press: {replan: bridge_out}
    seeds: [1, 2, 3]
  collapse_late:
    press: {replan: collapse_late}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 1240
    height: 760
