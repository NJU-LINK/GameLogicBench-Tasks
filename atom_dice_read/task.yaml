name: atom_dice_read
kind: atom
description: >
  Behavior task (3D physics: dice settle detection + top-face reading): dice are THROWN onto a
  table as RigidBody3D and tumble/bounce under real physics. Every physics frame the controller
  sees each die's pose (position, basis) and linear/angular velocity plus the face-normal table
  and the timing facts (dt, deadline, report grace), and must decide when the WHOLE SET has come
  to rest, then REPORT each die's upward face value (on_tick(state) -> {"settled": true,
  "faces": {id: value}}). The judge steps the same authoritative simulation and asserts black-box,
  self-consistently (truth read from the same run's normal-dot-UP orientation, never a pre-baked
  value): reporting rest that isn't rest — outside the velocity bands at the report, back in
  motion after the report, or the die ends on a different face — FAILS (premature_report,
  settle_detection); a reported value disagreeing with the die's actual upward face FAILS
  (wrong_face, face_read); missing the deadline FAILS (never_reported, completion); sitting on a
  settled table past the grace window FAILS (late_report, completion). Only 3D rigid-body task in
  the library.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  stack_topple:
    seeds: [1, 2, 3, 4, 5]
  fine_tick:
    seeds: [1, 2, 3, 4, 5]
  late_shove:
    seeds: [3, 4, 14, 18, 26]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
  timeout:
    container: 240
    wall: 270

record:
  window:
    width: 720
    height: 540
