name: atom_active_frames
kind: atom
description: >
  Behavior task (combat: attack-window timing): drive an attacker to land its active window on a
  moving target. An attack is NOT instant — after declaring an attack intent the sequence is:
  windup W frames -> active A frames (hit succeeds if target is within ATK_RANGE during this
  window) -> recovery R frames; the unit is locked the entire time. The target moves along a
  scripted trajectory and enters ATK_RANGE only during a narrow time window. The controller must
  LEAD the target: declare the attack before the target arrives so the active window covers the
  target's passage. The controller reads the window table (W/A/R) and the target's current
  position + velocity from state. The judge asserts black-box observables only (hits landed,
  swing count). Re-judged across hand-designed scenarios × seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  swift_pass:
    seeds: [1, 2, 3, 4, 5]
  feint_pass:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
