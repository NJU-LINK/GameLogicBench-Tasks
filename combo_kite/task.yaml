name: combo_kite
kind: combo
description: >
  COMPOSED behavior task (hit-and-run kite) — a remote unit harassed by 1-2 melee chasers.
  The controller must execute the kite loop: enter attack range, fire once, then retreat during
  the cooldown before the chasers close to danger distance; return to fire again when ready.
  Five calibrated atoms orchestrated into one coherent task; every FAIL carries "broken_link"
  that localizes the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  move_navigation:
    press: {move_navigation: door_shut}
    seeds: [1, 2, 3]
  pocket_door:
    press: {move_navigation: pocket_door}
    seeds: [1, 2, 3]
  door_x_pace:
    press: {move_navigation: pocket_door, attack_cooldown: long_cooldown}
    seeds: [1, 2, 3]
  lunge:
    press: {lunge: enrage}
    seeds: [1, 2, 3]
  target_selection:
    press: {target_selection: close_contest}
    seeds: [1, 2, 3]
  ramp_cross:
    press: {target_selection: ramp_cross}
    seeds: [1, 2, 3]
  lunge_x_lock:
    press: {lunge: enrage, target_selection: close_contest}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
