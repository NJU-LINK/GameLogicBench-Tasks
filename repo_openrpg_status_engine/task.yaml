name: repo_openrpg_status_engine
kind: repo
description: >
  REAL-REPO producer task (round-11 repo producer wave, anchor task of the "a — complete the
  half-built system" form). The agent works inside GDQuest's Godot Open RPG (MIT code, CC0 art,
  Godot 4.4 — the combat subsystem of a finished JRPG, src/combat/**) and delivers the
  STATUS-EFFECT RESOLUTION ENGINE that the upstream only half-built: battlers carry a stat sheet
  with a general modifier substrate (BattlerStats.add_modifier / remove_modifier) and the design
  gestures at battlers "responding to status effects" (battler.gd docs), but nothing ever made
  effects timed or periodic — a modifier added is added forever, and there is no per-round
  resolution point. What is being tested is IMPLEMENTING A MECHANISM (a per-battler effect
  scheduler / ledger): the engine registers effects, resolves them once per round, expires them on
  the exact round, refreshes on re-application, and undoes stat modifiers when an effect ends.
  The combat constructs one engine per battle and calls setup(roster) / apply(target, effect) /
  tick(roster); the judge drives the game's OWN two-phase loop headless with the delivered engine
  wired in and asserts BLACK-BOX on observable battle state only — every battler's per-round
  health / attack / liveness — never on the engine's internals or return values. Scenario axis =
  the engine's CALLING PATTERNS (re-application, stat-modifier expiry, same-round ordering); seeds
  jitter decoy HP inside safe bands that never change who is targeted or the fight length.

scenarios:
  baseline:
    seeds: [1, 2, 3]
  refresh_storm:
    seeds: [1, 2, 3]
  fading_hex:
    seeds: [1, 2, 3]
  crossfire:
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://src/combat/status/status_engine.gd
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 1024

solve:
  resources:
    cpus: 2
    memory: 4g
    pids_limit: 1024
