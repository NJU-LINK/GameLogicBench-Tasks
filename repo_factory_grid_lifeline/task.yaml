name: repo_factory_grid_lifeline
kind: repo
description: >
  REAL-REPO producer task (round-12, b form: hollow-and-reimplement). The agent works inside
  FactorySurvivorsGame "Melt Them All" (coderKillo, MIT, Godot 4.2 project run under 4.4) -- a
  top-down factory survival game where smelters burn ore into heat, heat travels along player-laid
  pipes to power plants, power plants turn heat into electricity, and electricity feeds the turrets
  and crushers that keep the base alive. The upstream ships a complete ENERGY LIFELINE; the task
  version HOLLOWS it out and the agent reimplements it from a work-order spec. The deliverable:
    res://Systems/Power/PowerSystem.gd          -- the electric pool: source output pooled every
        system tick, receivers served IN PLACEMENT ORDER capped by the remaining pool, utilization
        written back, income (money) emitted equal to the tick's network power
    res://Systems/Power/PowerReceiver.gd        -- the battery gate every powered machine carries:
        claim = required x efficiency; banked charge caps at power_limit AND a full battery
        withdraws its claim (efficiency 0); consume_power() pays one requirement, restores the
        claim and reports success, or refuses
    res://Systems/Pipe/PipeHeatDistributor.gd   -- the heat network: connections rebuilt from the
        pipe paths (a receiver is fed by the nearest provider before it on its path), rebuilt
        BEFORE distributing on any tick that follows a network change; each provider hands each of
        its N receivers min(required_heat, stock/N) (truncated) and deducts what it sent
  What is tested is IMPLEMENTING A REAL ENERGY GRID: a conserving pool ledger with first-come-
  first-served famine arbitration, a battery state machine whose satiation exit re-routes the pool,
  a conservation-exact heat propagation network over pipe topology, and the repath-then-distribute
  tick phase -- with the headline coupling that the heat network's output IS the electric pool's
  input (cut a pipe provider and the collapse propagates heat -> plant output -> pool -> consumers
  in one tick). The judge is the FACTORY FOREMAN: it constructs the systems exactly the way the
  game does, registers real entity scenes through the game's own placement events, injects heat at
  HeatProviders, and drives Events.system_tick (the game's real 0.1s logic clock). It asserts
  BLACK-BOX on world observables and event streams only (received_power amounts per receiver,
  matieral_provided deliveries, HeatProvider.amount stock, PowerSource output, money_changed
  income, spawned projectiles) -- never on module return values and never on the deliverables'
  internal state ("reads the module through the world").

scenarios:
  baseline:
    seeds: [1, 2, 3]
  heat_split:
    press: {heat_conservation: heat_split}
    seeds: [1, 2, 3]
  heat_topology:
    press: {heat_conservation: heat_topology}
    seeds: [1, 2, 3]
  pool_scarce:
    press: {pool_conservation: pool_scarce}
    seeds: [1, 2, 3]
  battery_full:
    press: {receiver_gate: battery_full}
    seeds: [1, 2, 3]
  def_famine:
    press: {power_allocation: def_famine}
    seeds: [1, 2, 3]
  econ_famine:
    press: {power_allocation: econ_famine}
    seeds: [1, 2, 3]
  topo_surgery:
    press: {tick_phase: topo_surgery}
    seeds: [1, 2, 3]
  grid_cascade:
    press: {heat_conservation: heat_topology, pool_conservation: pool_scarce}
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://Systems/Power/PowerSystem.gd
    - res://Systems/Power/PowerReceiver.gd
    - res://Systems/Pipe/PipeHeatDistributor.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 640
    height: 360
