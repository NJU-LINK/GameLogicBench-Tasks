name: combo_jump_x_platform_phase
kind: combo
description: >
  Physics combo (ballistics x periodic-platform phase): drive a character from a high start
  platform, across a wide gap, onto a horizontally-shuttling ferry in the catch corridor (the only
  foothold there), ride it toward the goal, and step off. The single ballistic jump commits an
  irreversible flight time T (no second jump, constant gravity), so the ferry's phase at the
  committed arrival frame launch+T is decided the instant the character leaves the ground. Two
  coupled axes: axis A = ballistic launch-point reach (spatial, from atom_jump_landing); axis B =
  timing the irreversible launch to the periodic ferry (temporal scheduling, from
  atom_platform_ride). The coupling increment neither atom tests is the flight-time lookahead: the
  ballistic flight time T is BOTH the phase-lookahead amount and (via SPEED*T) the reachability
  tolerance.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  wide_gaps:
    press: {jump_landing: staggered_heights}
    seeds: [1, 2, 3]
  swift_ferry:
    press: {platform_ride: swift_ferry}
    seeds: [1, 2, 3]
  phase_flip:
    press: {jump_landing: staggered_heights, platform_ride: swift_ferry}
    seeds: [1, 2, 3, 4]
  bounce_lead:
    press: {jump_landing: wide_gaps, platform_ride: double_ferry}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 800
    height: 480
