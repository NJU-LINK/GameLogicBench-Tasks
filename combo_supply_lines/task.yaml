name: combo_supply_lines
kind: combo
description: >
  COMPOSED behavior task (RTS logistics-network defense — one shared war chest feeds a SINGLE serial
  conduit with HEAD-OF-LINE BLOCKING against a deadline, defending stationary strongpoints whose
  DELIVERY and INCOME are gated by a SUPPLY NETWORK: multi-source Dijkstra from the depots over
  un-broken edges, rail cost 1 / road cost 2, supplied iff least cost <= supply_cap; a garrison is
  delivered ONLY to a supplied region, a cut region's production pays floor/4 vs floor/2). The
  controller is the logistics command: every tick the judge applies any spec-scheduled line
  severances, lands finished relinks / delivers supplied garrisons and pays supply-weighted income
  (SimCore.pre_tick), hands the controller on_tick(state) -> {"queue": [request_id, ...]}, then
  settles the world authoritatively (SimCore.resolve_tick). The judge asserts BLACK-BOX on world
  observables only, with TWO MECHANISM GATES disclosed as war-office requirements in the README —
  garrison_ready (TIMING INVARIANT: at each wave's arrival tick the target's garrison already >= the
  wave's power) and materiel_delivered (CONSERVATION LEDGER: every funded defense unit delivered by
  the deadline) — plus the regions_standing narrative floor (subsumed by readiness; garrison never
  decays). The deepened walls (2026-07-26, replacing four saturated cells) are ADVERSARIAL
  CONSTRUCTIONS inside the disclosed rule family: a minimal reconnecting-SET attribution with a
  cheap decoy line (braid_cut), a MID-WATCH severance a plan-once book never sees (midwatch_cut),
  and a schedule-feasibility mirror pair on one identical board (boom_line: the garrison bill is
  only feasible behind an income relink / lean_line: any relink spend is fatal) — no fixed
  invest-or-not doctrine survives both. Every FAIL carries "broken_link" = the failing region's
  judge-only axis tag.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  boom_line:
    press: {economy: boom_line}
    seeds: [1, 2, 3]
  lean_line:
    press: {economy: lean_line}
    seeds: [1, 2, 3]
  braid_cut:
    press: {supply_repair: braid_cut}
    seeds: [1, 2, 3]
  midwatch_cut:
    press: {supply_repair: midwatch_cut}
    seeds: [1, 2, 3]
  full_watch:
    press: {supply_repair: sever_relief, triage: split_relief}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
