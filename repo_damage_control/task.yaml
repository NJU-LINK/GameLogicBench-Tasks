name: repo_damage_control
kind: repo
press_semantics: true
description: >
  ALLOC v2 cross-system task (FTL-style shipboard damage control). One damage-control officer drives
  a 1-D corridor ship that fuses TWO live subsystems on ONE shared crew pool: CREW-SLOT DISPATCH
  (rooms with docking slots + capacities; crew walk continuously; doors open only after a delay) and
  HAZARD (rooms carry oxygen/fire/breach; fire grows, spreads through open doors, consumes air and
  self-starves; failing air suffocates crew). Each tick the controller returns {"seal": {door:bool},
  "crew": {unit:slot}} — a sealed door blocks fire AND crew. The tension is the alloc flip: a distant
  fire spreads long before any crew could walk to it, so the only containment is sealing — and
  sealing to protect a clean room can wall a station off (an airless room can't be walked through),
  so containment costs a station's coverage. The shared scarce pool is STATION COVERAGE (each crew is
  one coverage unit; sealing/holding spends coverage). Judge is two-stage and black-box: a full watch
  flags crew_death (crew_safety) and fire_spread/fire_not_out (fire_control) per tick, and a terminal
  crew-slots assertion (L1..L5) checks the settled station config — with an EXEMPTION so a station
  that is on fire, airless, or walled off from breathable air is not required to be manned (its crew
  waits at staging). Every FAIL carries broken_link.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  over_capacity:
    press: {over_capacity: waitlist}
    seeds: [1, 2, 3]
  slot_contention:
    press: {slot_contention: split_pair}
    seeds: [1, 2, 3]
  door_delay:
    press: {door_delay: late_doors}
    seeds: [1, 2, 3]
  reassign:
    press: {reassign: mid_reorder}
    seeds: [1, 2, 3]
  many_fires:
    press: {fire_control: many_fires}
    seeds: [1, 2, 3]
  open_chain:
    press: {fire_control: open_chain}
    seeds: [1, 2, 3]
  low_o2_room:
    press: {crew_safety: low_o2_room}
    seeds: [1, 2, 3]
  compound_crisis:
    press: {crew_safety: compound_crisis}
    seeds: [1, 2, 3]
  hold_stations:
    press: {crew_allocation: hold_stations}
    seeds: [1, 2, 3]
  pull_to_fight:
    press: {crew_allocation: pull_to_fight}
    seeds: [1, 2, 3]
  damage_control:
    press: {crew_allocation: pull_to_fight, over_capacity: waitlist}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 940
    height: 240
