name: combo_push_commit
kind: combo
description: >
  COMPOSED behavior task (push-only crate puzzle / irreversible commitment). One worker, kinded
  crates and kinded delivery zones on a walled grid; the controller returns ONE direction per tick
  and the world executes it before asking again — stepping into a crate pushes it one cell, and
  crates can NEVER be pulled back, so every push permanently narrows the state space. The
  emergent-correct controller plans each crate's whole push route BEFORE committing to it: refuse
  any push that leaves a crate frozen off its zone (corner/wall pockets), accept routes whose first
  pushes move a crate AWAY from its zone, order the crates so one crate's parked position never
  walls off another's corridor, and deliver each crate to a zone of its MATCHING kind. The judge
  drives the run tick by tick and asserts the emergent consequences black-box (all crates delivered
  within a satisficing tick budget; a freeze is failed the instant it is created) — never a unique
  route, since the budget admits many. Every FAIL carries "broken_link" localizing the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  deadlock_guard:
    press: {deadlock_guard: corner_bait}
    seeds: [1, 2, 3]
  detour_plan:
    press: {detour_plan: wall_peel}
    seeds: [1, 2, 3]
  box_coupling:
    press: {box_coupling: pair_freeze}
    seeds: [1, 2, 3]
  typed_corridor:
    press: {typed_order: kind_bait, box_coupling: pair_freeze}
    seeds: [1, 2, 3]
  unpark_required:
    press: {detour_plan: unpark_required}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
