name: combo_search_last_known
kind: combo
description: >
  COMPOSED behavior task (guard search phase) — a stealth-guard patrol that ARMS one combo-original
  orchestration axis, `search`. Two calibrated atoms provide the ambient mechanisms (line-of-sight
  perception, wall navigation); the combo's own layer is the SEARCH commitment: when the guard has
  engaged a quarry and then loses sight of it to COVER while it is still in range, it must advance to
  where it last saw it (last_known) before breaking off — a cross-frame memory + commitment the
  reactive `see?chase:patrol` form lacks. The controller reports each frame whom it is pursuing and
  how it moves (on_tick(state) -> {"move", "chasing"}); the judge recomputes the authoritative
  visibility truth from the guard's CURRENT position and tracks — purely from the guard's body
  geometry, never its claims — engagement and where the quarry was last seen, then asserts the full
  story black-box. Every FAIL carries "broken_link" (search | line_of_sight | move_navigation |
  engagement | return | completion). Re-judged across a baseline scenario and two hidden cover-break
  scenarios (search armed) × seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  corner_slip:
    press: {search: corner_slip}
    seeds: [1, 2, 3, 4, 5]
  deep_hide:
    press: {search: deep_hide}
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
