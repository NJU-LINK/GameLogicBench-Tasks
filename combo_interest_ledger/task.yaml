name: combo_interest_ledger
kind: combo
description: >
  COMPOSED behavior task (autobattler economy — ONE shared purse feeds a THREE-WAY competition every
  tick: buy CARDS for immediate combat power, buy XP to raise the FIELD CAP, or buy a BOND that pays
  INTEREST, against threat waves on stationary fronts). The controller is the treasury command: every
  tick the judge brings finished units online / raises the field cap / returns matured bonds and pays
  flat income (SimCore.pre_tick), hands the controller on_tick(state) -> {"queue": [request_id, ...]},
  then settles the world authoritatively (SimCore.resolve_tick) under fixed disclosed rules — the queue
  is funded with SKIP SEMANTICS (each order funded if affordable, else skipped; nothing blocks), then
  every active wave hits its target front for max(0, power - fielded). FIELDED is a CAP-GATED sum: a
  front fields only its best `level` delivered cards, so raising the cap (xp) unlocks the power of cards
  already bought; and a BOND is a deposit that returns MORE gold than it cost after a build delay
  (reinvest to compound — the interest channel). The judge asserts a SATISFICING consequence bound
  BLACK-BOX on world observables only: keep EVERY threatened front standing through its wave. The novel
  wall is allocation of one purse across TWO compounding channels — save (bonds grow idle gold) and
  leverage (xp raises the cap that turns gold into fielded power) — versus immediate tempo (cards): the
  hidden scenarios flip which is worth the same coin. Every FAIL carries "broken_link".

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  slow_burn:
    press: {interest: slow_burn}
    seeds: [1, 2, 3]
  early_rush:
    press: {interest: early_rush}
    seeds: [1, 2, 3]
  heavy_front:
    press: {leverage: heavy_front}
    seeds: [1, 2, 3]
  full_ledger:
    press: {interest: slow_burn, leverage: heavy_front}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
