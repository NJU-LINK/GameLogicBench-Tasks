name: atom_light_occlusion
kind: atom
description: >
  Rendering task (lighting + shadow occlusion; the library's first rendered-judge task): the game
  ships a torch-lit dungeon chamber — a torch, gray stone floor, and stone walls — but the lighting
  layer is unimplemented (the room renders flat). The deliverable sets up the scene lighting
  (setup_lighting(world, spec)): the torch must actually illuminate its surroundings and the walls
  must actually block that light. The judge renders the settle frame under the deterministic
  software-GL stack and asserts PIXEL RELATIONS only (never a golden image): (a) the torch lights
  its open surroundings well above the ambient floor, (b) brightness decays monotonically with
  distance from the torch and reaches near-ambient at the torch's range, (c) every wall casts a
  shadow — the point behind the wall (inside the geometric shadow cone) is darker by a margin than
  the equally-distant open control point. All sample coordinates are derived from the seed's scene
  geometry (never absolute pixels); gray zones (shadow-cone edges, the range ring band) are never
  judged — constructive tolerance bands, the line_of_sight discipline in pixel space.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
  mode: rendered
  window:
    width: 640
    height: 480

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  twin_walls:
    seeds: [1, 2, 3, 4]
  short_reach:
    seeds: [1, 2, 3, 4]
  relight:
    seeds: [1, 2, 3, 4]
