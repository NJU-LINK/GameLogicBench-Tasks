name: combo_wolfpack
kind: combo
description: >
  COMPOSED behavior task (wolfpack hunt), deepened 2026-07-26: a pack of wolves runs ONE
  controller instance each (same brain) and must advance as a cohesive flock (overlap floor,
  ambient), SURROUND each prey it engages (encirclement ring, windowed angular bound), keep the
  lock discipline over multiple prey (target_selection), and run the pack's STRIKE CRAFT — break
  away from a prey's counter-lash after every bite (disengage: strike@f commits the striker to be
  clear of lash_reach by f+lash_delay), never let a rallying prey catch its breath (pressure:
  inter-strike gap on an engaged prey <= rally_window, shorter than one weapon cooldown, so the
  relay takes 3+ wolves threaded through lash orbits), and finish frail prey to the exact strike
  (clean_kill: same-frame batches settle together and must never exceed remaining hp). The judge
  integrates all wolves together and asserts every link black-box; every FAIL carries
  "broken_link" (boids | encirclement | attack_cooldown | target_selection | disengage |
  pressure | clean_kill | completion). Re-judged across a baseline scenario and hand-designed
  hidden scenarios x seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  encirclement:
    press: {encirclement: cruise_loop}
    seeds: [1, 2, 3, 4]
  target_selection:
    press: {target_selection: close_contest}
    seeds: [1, 2, 3, 5]
  lash:
    press: {disengage: counterstrike}
    seeds: [2, 3, 4, 8]
  lash_x_rally:
    press: {disengage: counterstrike, pressure: tight_rally}
    seeds: [2, 5, 8]
  cull:
    press: {clean_kill: frail_herd}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 960
    height: 640
