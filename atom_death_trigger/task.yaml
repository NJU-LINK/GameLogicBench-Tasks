name: atom_death_trigger
kind: atom
description: >
  Behavior task (combat: death / terminal-state trigger): drive a boss that fights target dummies
  whose counterblows damage the BOSS itself — and, when its own HP reaches zero, dies CLEANLY. The
  controller returns an intent each physics frame (on_tick(state) -> {"move", "attack",
  "death_ack"}); the judge lands the scripted counterblows, settles intents, and asserts black-box
  observables only (own-HP timeline / action consequences / ack timing), never reading the
  controller: while alive the usual range/cooldown rules apply; after death any acted-on intent
  FAILS, the one-time "death_ack" must arrive exactly once within a short window, and the corpse
  must stay inert through follow-up blows. Dying is gated on the boss's own landed hits/kills, so
  a do-nothing controller never triggers the death script and times out. Re-judged across
  hand-designed scenarios × seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  midfight_death:
    seeds: [1, 2, 3, 4, 5]
  lowhp_dwell:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
