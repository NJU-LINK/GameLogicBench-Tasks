name: combo_sweep_collision
kind: combo
description: >
  Production-side task (motion-solver module; callee form): the game ships a movement system that
  lays out a level's solid walls in a real PhysicsServer2D world, creates a kinematic body, and pushes
  it each frame — but the module that turns a requested motion into a legal new position is
  unimplemented. The deliverable is that module: a stateful callee with setup(params) /
  solve(from, motion)->Vector2. It is handed the RID of the kinematic body (not the wall layout) plus
  the safe margin and a slide budget, and each frame it must move the body one step by running its own
  PhysicsServer2D.body_test_motion sweeps: stop a fast step at a wall instead of passing through,
  depenetrate a body that starts inside a wall, slide the blocked remainder along the surface, and keep
  resolving surfaces within a frame so one step can round a corner or climb a ramp. The judge drives
  the same per-frame motion plan against the module (observed trajectory) and, independently, against
  its own reference solver on a private reference body (expected trajectory), and scores the observable
  outcome — never reading the module's internals: an observed position that penetrates a wall beyond
  the safe margin FAILS (wall_penetration); an observed final position that differs from the
  independently reconstructed one by more than the tolerance FAILS (endpoint_drift). Contract fully
  disclosed (§8.4); the OOD axes are un-forewarned legal call patterns (a step larger than a wall is
  thick, a spawn-overlap, a diagonal graze, a big step spanning several surfaces). Re-judged across
  hand-designed scenarios × seed perturbation.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  fast_wall:
    press: {swept_stop: thin_wall}
    seeds: [1, 2, 3, 4]
  embed_spawn:
    press: {depenetration: spawn_overlap}
    seeds: [1, 2, 3, 4]
  grazing_slide:
    press: {slide_decompose: diagonal_graze}
    seeds: [1, 2, 3, 4]
  big_step:
    press: {multi_surface: floor_ramp}
    seeds: [1, 2, 3, 4]
