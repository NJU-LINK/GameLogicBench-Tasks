name: atom_attack_cooldown
kind: atom
description: >
  Production-side task (fire-control arbiter; callee form): the game ships a turret battery whose
  turrets share ONE power bank, but the fire-control arbiter — the module the game asks each time a
  turret wants to fire — is unimplemented. The deliverable is that arbiter: a stateful callee with
  setup(params) / advance(dt) / request_fire(turret_id)->bool. The turrets are trigger-happy (each
  asks every frame); the arbiter must grant a shot exactly when the shared bank holds the shot cost
  AND that turret has recovered, commit each grant against the single shared bank (so same-frame
  requests see the drawn-down bank), and measure recovery from the dt it is handed (game-seconds),
  never a frame count. The judge drives the whole battery and asserts the observable SHOT STREAM
  against an independent ledger of the shared bank and the per-turret cooldowns — never reading the
  arbiter's internals: a shot granted with the bank empty FAILS (overdraw); a turret granted again
  before its cooldown elapsed FAILS (cooldown_violation); a shot refused when the bank could clearly
  pay and the turret had clearly recovered FAILS (false_reject). Contract fully disclosed (§8.4);
  the OOD axes are un-forewarned legal call patterns (same-frame concurrency, stretched game-time).
  Re-judged across hand-designed scenarios × seed perturbation.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  concurrent_salvo:
    seeds: [1, 2, 3, 4]
  slow_field:
    seeds: [1, 2, 3, 4]
  fast_field:
    seeds: [1, 2, 3, 4]
