name: combo_dualgrid_terrain
kind: combo
description: >
  COMPOSED behavior task (an editable-terrain level whose APPEARANCE is a derived half-cell-offset
  grid, plus a unit crossing that terrain while it changes): the deliverable maintains the level's
  appearance layer -- each appearance cell is decided by the FOUR terrain cells at its corners
  (16 cases) -- and drives one survey unit to its goal without ever letting its body enter solid
  terrain. Terrain is edited during play (dug out, and collapsed back in). Two MECHANISM GATES, both
  equality/invariant assertions on world observables recomputed independently by the judge from the
  level spec's terrain grid (zero shared code path with the deliverable): display_sync (the appearance
  grid must equal the judge's own oracle cell-for-cell, every frame, and stay inside its own extent)
  and terrain_traverse (the unit's swept path must never penetrate a solid terrain cell beyond the
  graze tolerance). Arrival inside the frame budget is a validity gate only. Re-judged across
  hand-designed scenarios x seed perturbation. Every FAIL carries "broken_link" = the failing axis.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 640
    height: 288

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  far_edge_carve:
    press: {display_sync: far_edge_carve}
    seeds: [1, 2, 3]
  checker_diagonal:
    press: {display_sync: checker_diagonal}
    seeds: [1, 2, 3]
  collapse_ahead:
    press: {terrain_traverse: collapse_ahead}
    seeds: [1, 2, 3]
  stride_collapse:
    press: {terrain_traverse: stride_collapse}
    seeds: [1, 2, 3]
  stride_seal:
    press: {terrain_traverse: stride_seal}
    seeds: [1, 2, 3]
  blast_batch:
    press: {display_sync: blast_batch, terrain_traverse: collapse_ahead}
    seeds: [1, 2, 3]
