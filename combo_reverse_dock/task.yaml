name: combo_reverse_dock
kind: combo
description: >
  Behavior task (spacecraft reverse docking: committed three-phase approach): fly a Newtonian
  craft — SECOND-ORDER on both channels, the velocity vector AND the heading carry momentum — to
  a space station and BACK INTO its dock port. Each physics frame the judge hands the controller
  the craft's position/velocity/heading/spin plus the station and port geometry; the controller
  returns on_tick(state) -> {"thrust": Vector2, "turn": float}. The judge clamps both intents,
  integrates (linear drag; angular reaction-wheel damping that a scenario may lower), and asserts
  black-box observables only: the FIRST frame inside the capture ball adjudicates the run once —
  approach-sector bearing, contact speed <= v_dock, stern-first facing AND settled spin; touching
  the hull anywhere else at any time is a crash; running out the budget with no attempt fails.
  Composes the saturated atom_inertial_arrive (braking-distance law) with two combo-original
  links: hull clearance (the committed detour around the station) and attitude (spin management
  under damper failure). Re-judged across hand-designed scenarios x seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  far_side:
    press: {clearance: far_side}
    seeds: [1, 2, 3]
  hug_wall:
    press: {clearance: hug_wall}
    seeds: [1, 2, 3]
  hot_inbound:
    press: {inertial_arrive: short_dash}
    seeds: [1, 2, 3]
  tumble_start:
    press: {attitude: tumble_start}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
