name: repo_youtd2_buff_aura_engine
kind: repo
description: >
  REAL-REPO producer task (b 挖空重实现). The agent works inside YouTD 2 (MIT code, Godot 4.4
  native, ~735 .gd — the largest codebase in the pool), a finished lockstep-deterministic tower-
  defense game, and rebuilds its BUFF / AURA STATUS-EFFECT ENGINE: res://src/buffs/buff.gd
  (class_name Buff extends Node2D, 502 lines upstream) + res://src/buffs/aura.gd (class_name Aura
  extends Node2D, 222 lines upstream). Every status effect in the game — a tower's slow field, a
  damage-over-time stack, a stun, an item's timed bonus — is a Buff living on a Unit, and radius
  effects are projected by an Aura that rescans its caster's surroundings every 0.2 s. The
  mechanic-bearing methods of both classes are excavated to behavior-visible stubs: the buff's
  construction/teardown (_ready duration clock + unit signal wiring + CREATE, remove_buff,
  purge_buff, refresh_duration, set/get_remaining_duration, set_level), its event registry and
  dispatch (_add_event_handler, _add_periodic_event, _add_event_handler_unit_comes_in_range,
  _call_event_handler_list, _can_call_event_handlers and every _on_* callback), the stacking entry
  points BuffType calls back into (_refresh_by_new_buff, _upgrade_by_new_buff, _remove_as_aura,
  _emit_refresh_event, _change_giver_of_aura_effect), the item periodic-timer hand-over
  (get_periodic_timers, inherit_periodic_timers), and all of Aura except make() and get_range().
  The surrounding scaffolding (field declarations, the pure getters, _make_buff_event, _add_aura,
  Aura.make) stays as frozen given code, and so does the whole rest of the tree — crucially
  buff_type.gd (whose _do_stacking_behavior is the full four-branch stacking verdict),
  buff_range_area.gd + its scene (the frozen worked example of a 0.2 s range-membership diff),
  unit.gd, item.gd and aura.tscn. What is tested is the L2 status-effect contract — aura membership
  (who is inside the disc gets the effect, who leaves loses it), aura OWNERSHIP under multiple
  overlapping casters (only the aura that currently owns a buff may take it off; the strongest
  overlapping aura wins the arbitration), the one-shot discipline of the create/cleanup events (an
  accumulating periodic effect must not be knocked back to zero, and buff-applied property changes
  must net to zero), stun-counter conservation, and periodic-timer PHASE INHERITANCE across an
  item being taken off a tower and put back on. CSV numbers (aura ranges, level scaling, periods)
  and the stacking/ownership rules are a READING WALL (L3 difficulty source), never spelled out.
  The judge instantiates the real game_scene.tscn, drives a fixed judge-authoritative build
  (research element -> build aura towers -> optionally attach a periodic/stun item), runs full
  matches with unlimited_portal_lives so leak never ends a match, and asserts BLACK-BOX on
  world-observable effect behavior: it recomputes the "who should be inside which aura disc" set
  itself from tower positions + AuraProperties + Utils.get_units_in_range, samples each creep's
  movement-speed modifier band / stun flag / armor, and reads the tick-exact buff_list_changed,
  damaged and carrier-buff event streams. Scoring never reads lives/waves-cleared. Public baseline
  uses a single sparse wave with one level-0 aura tower so the naive stays correct; hidden
  scenarios arm creep traversal / two overlapping auras at different levels / an accumulating
  damage-over-time aura / a periodically stunning item / an item taken off mid-period / a carrier
  tower whose stat item stretches every timed effect it casts (r19 hardening) as
  UNANNOUNCED-BUT-LEGAL calling patterns, each arming exactly one contract family
  (handover_x_inherit arms two: aura_ownership + timer_inheritance, per-axis double probe).

scenarios:
  baseline:
    seeds: [1, 2]
  aura_traverse:
    seeds: [1, 2, 3]
  aura_handover:
    seeds: [1, 2, 3]
  dot_ladder:
    seeds: [1, 2, 3]
  cc_balance:
    seeds: [1, 2, 3]
  timer_inherit:
    seeds: [1, 2, 3]
  stretch_clock:
    seeds: [1, 2, 3]
  handover_x_inherit:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 300
    kill_after: 15
    wall: 330
  deliverable_paths:
    - res://src/buffs/buff.gd
    - res://src/buffs/aura.gd

solve:
  resources:
    cpus: 4
    memory: 12g
    pids_limit: 2048
