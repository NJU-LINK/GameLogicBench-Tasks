name: atom_patrol_edge
kind: atom
description: >
  Platformer AI task (patrol + ledge detection): a ground unit patrols a platform back and
  forth, turning around at cliff edges and obstacle walls without ever falling off. The
  controller returns a horizontal move intent each frame; the judge runs real CharacterBody2D
  physics (gravity + move_and_slide). Deepened 2026-07-26: the three static structural hidden
  scenarios (shifted_ledge / mid_wall / double_deck — dead cells, every model passed) were
  replaced by runtime-dynamics / time-base axes patterned on shifting_wall (the one live
  cell): a wall that vanishes mid-run, a same-frame twin-wall injection, and a stretched
  fixed timestep. PASS requires surviving the full episode on the home surface, covering a
  minimum span of the walkable stretch (no camping), and staying within a turn budget
  (no edge jitter) and an activity floor (no camping in place).

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  shifting_wall:
    seeds: [1, 2, 3, 4, 5]
  vanishing_wall:
    seeds: [1, 2, 3, 4, 5]
  pincer_walls:
    seeds: [1, 2, 3, 4, 5]
  slow_step:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
