name: repo_rts_harvest_engine
kind: repo
description: >
  REAL-REPO producer task (round-12, b form: hollow-and-reimplement). The agent works inside Open
  RTS (Lampe Games, MIT code + Kenney CC0 3D art, Godot 4.4) -- a complete real-time strategy match
  with workers, a two-currency economy, production queues, two-stage construction, and ranged combat.
  The upstream ships a complete unit RESOURCE-COLLECTION engine; the task version HOLLOWS it out and
  the agent reimplements it from a work-order spec. The deliverable is the harvest a worker runs when
  it is ordered to gather:
    res://source/match/units/actions/CollectingResourcesSequentially.gd  -- the 3-state harvest loop:
        go to the mine, collect until full, haul back to a command center and unload, repeat -- with
        the exception edges (a mine runs dry -> re-path to the next; a CC is razed -> re-target another)
    res://source/match/units/actions/CollectingResourcesWhileInRange.gd  -- the collecting sub-action:
        pull one unit per COLLECTING_TIME_S of game time while adjacent to the mine; pause while the
        worker is passively shoved; stop when full or out of adjacency
    res://source/match/units/actions/MovingToUnit.gd                     -- the adjacency approach:
        walk up to another unit's edge (not its centre) and stop when adjacent; chase it if it moves
  What is tested is IMPLEMENTING A REAL HARVEST ENGINE: a collecting clock keyed to resource type, a
  3-point conservation ledger (mine -> worker bag -> treasury), a state-machine loop that recovers
  from depletion and CC loss, an adjacency gate, and -- the headline coupling -- a passive SHOVE
  (a spatial avoidance event) that PAUSES the collecting clock (a timing mechanism). The judge is the
  COMMANDER: it builds the real Match on PlainAndSimple with one plain Player, spawns mines + a built
  CommandCenter + worker(s) through the game's OWN paths, and drives the harvest through the game's
  OWN verb (worker.action = CollectingResourcesSequentially.new(mine)). It asserts BLACK-BOX on
  move-independent world-observable quantities only (mine remaining, worker bags, player treasury --
  integer ledger quantities -- plus the units_adhere boolean at each transfer and the frame of each
  transfer) -- never on exact worker coordinates. The action's return values are never scored;
  correctness is judged by what happened to the world (the "reads the module through the world" rule).

scenarios:
  baseline:
    seeds: [1, 2, 3]
  sustained_cadence:
    press: {cadence: sustained_cadence}
    seeds: [1, 2, 3]
  resource_b_cadence:
    press: {cadence: resource_b_cadence}
    seeds: [1, 2, 3]
  depletion:
    press: {continuity: depletion}
    seeds: [1, 2, 3]
  cc_razed:
    press: {continuity: cc_razed}
    seeds: [1, 2, 3]
  free_credit:
    press: {conservation: free_credit}
    seeds: [1, 2, 3]
  passive_gate:
    press: {range_gate: passive_gate}
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://source/match/units/actions/CollectingResourcesSequentially.gd
    - res://source/match/units/actions/CollectingResourcesWhileInRange.gd
    - res://source/match/units/actions/MovingToUnit.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 1920
    height: 1080
