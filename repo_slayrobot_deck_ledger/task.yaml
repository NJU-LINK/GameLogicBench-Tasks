name: repo_slayrobot_deck_ledger
kind: repo
description: >
  REAL-REPO producer task (b — hollow-and-reimplement). The agent works inside "Slay the Robot", a
  Godot 4 Slay-the-Spire-style deckbuilder framework (MIT; upstream notes in README_UPSTREAM.md), and
  reimplements the CARD-PILE LEDGER and the CARD-PLAY QUEUE — the singleton that owns the player's
  draw / hand / discard / exhaust piles, moves cards between them, draws the turn's hand, shuffles the
  deck, and lines card plays up while charging their energy. The upstream ships everything around it
  intact: the Hand UI that renders the piles, the Combat screen that displays their counts, the whole
  action pipeline (ActionDraw / ActionReshuffle / ActionAddCardsToDraw / the interceptor chain), the
  card data table with each card's shuffle priorities and play/end-of-turn destinations, the stats
  ledger, the end-of-turn machinery, and roughly thirty call sites across the repo. Only eight method
  bodies of res://autoload/HandManager.gd are hollowed to a stub (~235 lines: the limbo detach, the
  destination dispatch, the play-queue enqueue and drain, the queue clear and refund, the draw, and
  the shuffle) plus one zero-consumer internal counter removed. The behaviour contract (which end of a
  pile is the top of the deck, when a spent discard pile comes back and in which order, how the hand
  limit gates a draw, where a banished card goes, and when the energy for a queued play is charged and
  given back) is NOT in the README — it must be reconstructed from the intact surrounding code (the
  reading wall). The judge boots the game's own Root scene, plays real turns through the frozen entry
  points, and asserts BLACK-BOX on frozen-world observables only — the Combat screen's pile and energy
  Labels, the Hand UI's own card nodes, the relative order of the game's card signals, and the frozen
  stats counters — never on the singleton's arrays, queue or counters. Every FAIL carries a
  broken_link localising the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  reshuffle_flip:
    seeds: [1, 2, 3]
  dry_deck:
    seeds: [1, 2, 3]
  hand_cap:
    seeds: [1, 2, 3]
  dest_matrix:
    seeds: [1, 2, 3]
  energy_reserve:
    seeds: [1, 2, 3]
  xcost_bound:
    seeds: [1, 2, 3]

record:
  window:
    width: 1200
    height: 700

judge:
  deliverable_paths:
    - res://autoload/HandManager.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 300
    kill_after: 15
    wall: 360

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048
