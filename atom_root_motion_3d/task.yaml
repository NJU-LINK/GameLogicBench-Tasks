name: atom_root_motion_3d
kind: atom
description: >
  Animation task (3D root-motion-driven movement): the game plays a locomotion clip on an
  AnimationPlayer, owns its clock (advances it each frame), and hands the controller the root-motion
  delta the clip produced -- a local-space position delta. The controller applies that delta to a
  CharacterBody3D (in the body's facing frame) blended with gravity + move_and_slide, so the body
  travels exactly as the playing animation declares. Every physics frame the judge calls
  tick(state) after advancing the animation; state carries root_motion (the frame's delta), the body
  pose, and the goal. The judge asserts black-box: reaching within goal_radius (3D) PASSES; the body's
  windowed 3D displacement leaving [0.7,1.3] x the playing clip's DECLARED displacement FAILS
  (displacement_mismatch, root_motion); the budget expiring without arriving FAILS (never_arrived,
  root_motion). Zero external assets: the clips are procedural Animation resources; the AnimationPlayer
  uses callback_mode_process = MANUAL (else its IDLE auto-advance races the game's advance and makes
  root motion non-deterministic under bare headless).

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  mid_run_switch:
    seeds: [1, 2, 3]
  slope_climb:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 720
    height: 540
