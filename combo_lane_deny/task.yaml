name: combo_lane_deny
kind: combo
description: >
  COMPOSED behavior task (passing-lane denial: threat-weighted lane coverage held through pump-fakes)
  — a single defender, a speed-capped circle confined to a box between a passer and two receivers,
  must cut off a fixed sequence of passes. Each physics frame the judge feeds the controller the
  world state (defender pose/box, both goal corners, passer pose/facing/phase, ball pos+vel, and both
  receivers' pos/vel/danger) and the controller returns on_tick(state) -> {"move": Vector2} (unit-
  capped move intent; the defender can never teleport). The judge authoritatively drives the passer
  through dribble/wind-up/pass events — wind-ups are sometimes pulled back (pump-fakes, aim readable
  from passer_facing) before the true pass, which may go to the OTHER receiver — and flies each
  struck pass as a flat straight drive to the target receiver's position, ruling a DENY when the
  defender's body meets the ball line (continuous per-frame closest approach, no tunnelling) and a
  COMPLETION when the ball reaches its receiver. Black-box observable only: at least (passes - 1)
  passes denied. Every FAIL carries broken_link (lane_cover | keeper_arc | completion). Re-judged
  across a baseline and hand-designed hidden scenarios x seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  symmetric_feint:
    press: {keeper_arc: feint_switch}
    seeds: [1, 2, 3]
  wide_lanes:
    press: {lane_cover: asym_receivers}
    seeds: [1, 2, 3]
  bait_switch:
    press: {lane_cover: asym_receivers, keeper_arc: feint_switch}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
