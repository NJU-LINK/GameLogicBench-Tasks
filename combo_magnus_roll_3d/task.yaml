name: combo_magnus_roll_3d
kind: combo
description: >
  COMPOSED 3D physics-behaviour task (a links-style ball flight and roll-out model): the deliverable
  IS the ball's motion module -- every physics frame the game hands it the ball's position, the air
  flow at that position, the resistance of the turf under it, any contact the world resolved last
  frame and the impulse of any shot played this frame; the module returns the ball's velocity and
  spin, and the world applies it. The world holds no part of the dynamics and does not hold the
  ball's velocity at all. Four MECHANISM GATES, all recomputed by the judge from the POSITION TRACE
  alone (finite differences and plane geometry; zero shared code path with the deliverable, no
  reference trajectory, no reference integrator): air_field (after the air flow changes, the ball's
  lateral acceleration must follow the CURRENT flow), turf_field (the roll deceleration must match
  the turf the ball is on THIS frame), roll_terminal (the ball must come to an EXACT standstill
  exactly where the turf can hold it -- and must not freeze where it cannot), shot_carry (a shot
  superposes on whatever the ball is already doing). Coverage gates: spin_back (a back-spun first
  bounce must send the ball backwards) and apex_decay (successive apexes strictly decrease).
  Re-judged across hand-designed scenarios x seed perturbation. Every FAIL carries "broken_link" =
  the failing axis.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 960
    height: 540

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  wind_shift:
    press: {air_field: wind_shift}
    seeds: [1, 2, 3]
  gust_band:
    press: {air_field: gust_band}
    seeds: [1, 2, 3]
  zone_split:
    press: {turf_field: zone_split}
    seeds: [1, 2, 3]
  hold_slope:
    press: {roll_terminal: hold_slope}
    seeds: [1, 2, 3]
  run_slope:
    press: {roll_terminal: run_slope}
    seeds: [1, 2, 3]
  second_shot:
    press: {shot_carry: second_shot}
    seeds: [1, 2, 3]
  slope_zone:
    press: {turf_field: slope_zone, roll_terminal: run_slope}
    seeds: [1, 2, 3]
  gust_shot:
    press: {air_field: gust_band, shot_carry: second_shot}
    seeds: [1, 2, 3]
