name: atom_platform_ride
kind: atom
description: >
  Physics task (moving platform): the character must board a horizontally-shuttling
  platform, ride it across a wide gap, then step off onto the goal platform.
  The controller returns a move intent (float) and jump intent (bool) each frame.
  The judge runs real CharacterBody2D physics (gravity + move_and_slide) with an
  AnimatableBody2D platform driven by position updates. The key trap is phase
  awareness: the platform shuttles back and forth, so the character must time the
  boarding and exit — jumping onto the platform when it is close to the start side,
  then stepping off when it reaches the goal side.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  swift_ferry:
    seeds: [1, 2, 3, 4, 5]
  double_ferry:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 800
    height: 480
