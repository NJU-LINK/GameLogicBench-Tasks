name: atom_group_avoidance
kind: atom
description: >
  Behavior task (movement: group avoidance / no overlap): move a group of units from their start
  positions to assigned goal positions in an open arena WITHOUT their circular bodies overlapping.
  The game instantiates ONE controller per unit; each physics frame every unit's controller returns
  a VELOCITY (on_tick(state) -> Vector2) and the judge integrates all units together. The judge
  asserts black-box observables only (pairwise centre distances / arena bounds / arrival), never
  reading a controller: two bodies interpenetrating beyond a small tolerance FAILS (overlap); a unit
  leaving the arena FAILS (out_of_bounds); every unit reaching its assigned goal within the frame
  budget PASSES (reaching the assigned goal slots IS forming the target formation); a deadlock that
  never completes FAILS (timeout). A shared avoidance-map handle is offered via state.nav_map — the
  controller MAY register an engine avoidance agent on it or steer itself; the judge does not resolve
  collisions for it. Re-judged across hand-designed scenarios × seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  crossing_streams:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 900
    height: 640
