name: atom_hitstun_recovery
kind: atom
description: >
  Systems task (combat: hitstun / control-effect state machine — callee form): the game drives a
  control-effect state machine the agent delivers at res://logic/controller.gd. Each frame the game
  may apply() a named control effect for a duration, calls advance(dt) to hand the machine the game
  time that elapsed this frame, reads is_actionable() / remaining(), and reacts to the machine's
  expired(effect) signal. World rules: while an effect is active the entity is not actionable;
  applying overrides the active effect (latest wins / refresh, no stacking); advance(dt) tracks the
  timer in GAME time (dt may be 0.0 on a frozen frame); the effect expires (and emits) when its
  timer reaches 0. The judge drives a scenario timeline while an INDEPENDENT reference recomputes
  the answers, then asserts black-box observables only: is_actionable()/remaining() match the
  reference every frame (a small boundary grace around each expiry absorbs float rounding) and
  expired fires once per effect on the reference's expiry frame. Never reads the machine's internals.
  Re-judged across a public timeline and hidden timelines (un-forewarned calling patterns) — the
  perturbation axis.

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  pause_freeze:
    seeds: [1, 2, 3, 4, 5]
  chain_reentry:
    seeds: [1, 2, 3, 4, 5]
  chain_under_pause:
    seeds: [1, 2, 3, 4]
