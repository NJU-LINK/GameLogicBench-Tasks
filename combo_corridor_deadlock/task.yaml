name: combo_corridor_deadlock
kind: combo
description: >
  Behavior task (grid occupancy mutex: shared-corridor right-of-way deadlock): route M controlled
  units (2-4) across a walled integer grid so EVERY unit reaches its own goal cell. A single
  controller commands all units: each tick the judge hands it the arena (grid size, wall cells) and
  every unit's position + goal, and on_tick(state) returns an Array of per-unit moves, one of
  "up"/"down"/"left"/"right"/"wait". The judge advances all units at once under two rules -- OCCUPANCY
  MUTEX (no two units on the same cell; two units aiming at one cell are both refused; a unit aiming
  into a stationary unit's cell is refused) and NO SWAP (two adjacent units may not exchange cells in
  one tick) -- a refused move leaves the unit in place and counts a blocked event. The judge asserts
  black-box observables only (unit position trajectories, arrival, blocked counts): PASS = every unit
  simultaneously on its goal within the tick budget; DEADLOCK = no unit improves its best distance-to-
  goal for K consecutive ticks while unfinished (the symmetric standstill a reactive solver falls
  into); TIMEOUT = budget exhausted, not all arrived. In a width-1 corridor two units heading
  opposite ways cannot both advance; a reactive "each unit independently heads for its goal and waits
  when blocked" solver locks face-to-face, so the correct solution must BREAK SYMMETRY -- one side
  sacrifices progress (steps aside into a passing bay / yields) so the other passes first. Re-judged
  across hand-designed scenarios x seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  head_on:
    press: {right_of_way: head_on}
    seeds: [1, 2, 3]
  double_cross:
    press: {right_of_way: double_cross}
    seeds: [1, 2, 3]
  solver_blowup:
    press: {right_of_way: solver_blowup}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
