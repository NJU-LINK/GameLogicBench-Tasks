name: combo_anim_events
kind: combo
description: >
  PURIFIED-mechanism task (combo): implement the ANIMATION FRAME-EVENT DISPATCHER for a melee combat
  rig (a callee the game drives). The game plays a real Godot AnimationPlayer as the authoritative
  clock; the dispatcher reads current_animation + current_animation_position each frame and reports
  which gameplay frame-events (guard_drop / strike / recover / stumble) fire, per a disclosed
  contract table. Interface: setup(anim_player, events) once, then poll(just_sought)->Array once per
  frame after the game has moved the clock. The judge plays a scripted animation timeline against the
  delivered dispatcher to get the OBSERVED per-frame event stream, plays the SAME timeline against its
  OWN independently-authored reference dispatcher (judge/model.gd) reading the same real engine clock
  to get the EXPECTED one, and asserts observed == expected BLACK-BOX -- it never trusts the delivered
  module's output as an answer. Every FAIL carries a broken_link naming the contract link that broke.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  low_fps:
    press: {bigstep: multi_cross}
    seeds: [1, 2, 3]
  haste:
    press: {speed: runtime_scale}
    seeds: [1, 2, 3]
  seek_resync:
    press: {seek: skip_ahead}
    seeds: [1, 2, 3]
  state_cut:
    press: {interrupt: cancel_pending}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
  timeout:
    container: 60
    kill_after: 10
    wall: 90
