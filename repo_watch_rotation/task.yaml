name: repo_watch_rotation
kind: repo
press_semantics: true
description: >
  ALLOC v2 cross-system task (stealth night-watch guard rotation). One security controller drives
  TWO guards that share a fixed HEADCOUNT across TWO posts (A, C) each watching a corridor to the
  right-edge restricted zone, plus an intermittent SEARCH obligation (a quarry rounding mid-field
  cover). Each frame the controller returns {"guards": {id:{move,chasing}}, "alarms": {post_id:bool}}.
  It fuses two live subsystems: per-post SUSPICION (a hidden, MANNED-GATED cross-frame integrator that
  rises with salience only while a guard mans the post and the intruder is in its cone, drains
  otherwise — atom_suspicion_meter) and CHASE/SEARCH commitment (engage a visible quarry, and when it
  slips to cover in range advance to last-known before breaking off — combo_search_last_known). The
  scarce pool is the two guards: manning both posts leaves nobody to search, so a search STEALS a
  guard off a post — affordable only when that post fills slowly. Judge is black-box on world geometry
  only: per-post alarm timing vs the authoritative meter (premature/missed/late/false), a post_breach
  when an unwatched corridor's intruder reaches the zone, abandoned_search / intruder_breach on the
  search axis. Every FAIL carries broken_link ∈ the cell's armed axes.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  slow_leak:
    press: {suspicion_meter: slow_leak}
    seeds: [1, 2, 3, 4, 5]
  close_rush:
    press: {suspicion_meter: close_rush}
    seeds: [1, 2, 3, 4, 5]
  peek_flicker:
    press: {suspicion_meter: peek_flicker}
    seeds: [1, 2, 3, 4, 5]
  corner_slip:
    press: {search: corner_slip}
    seeds: [1, 2, 3, 4, 5]
  deep_hide:
    press: {search: deep_hide}
    seeds: [1, 2, 3, 4, 5]
  crunch_afford:
    press: {suspicion_meter: slow_leak, search: corner_slip}
    seeds: [1, 2, 3]
  crunch_deny:
    press: {suspicion_meter: close_rush, search: deep_hide}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
