name: combo_squad
kind: combo
description: >
  Squad-assault combo. Four squad units run ONE controller instance each (same brain): march from
  the left edge to assigned battle stations without any two bodies ever overlapping, then destroy
  two enemy dummies with paced, in-range, correctly-locked fire (every unit has its own weapon
  clock) while keeping the squad's fire split (at most two units may effectively strike one enemy).
  The judge integrates all units together and asserts every link black-box; every FAIL carries a
  "broken_link". ARMED hidden axes: group_avoidance (transplant, KEPT weak cell) + two ORIGINAL
  axes — reassign (per-unit station-following: a battle station relocated mid-march, read
  station_pos live or park stale) and focus_fire (cross-unit coordination: three units share one
  enemy's reach, distribute fire or pile on).
  attack_cooldown / target_selection are AMBIENT world rules (checked every cell, no scenario arms
  them; broken_link words retained). Re-judged across baseline + hand-designed hidden scenarios
  (one armed axis each) × seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  group_avoidance:
    press: {group_avoidance: crossing_streams}
    seeds: [1, 2, 3, 4]
  reassign:
    press: {reassign: mid_march}
    seeds: [1, 2, 3]
  focus_fire:
    press: {focus_fire: shared_reach}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
