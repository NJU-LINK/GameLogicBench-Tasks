name: combo_chaser
kind: combo
description: >
  COMPOSED behavior task (guard patrol / chase) — the second combo: three calibrated atoms
  (line-of-sight perception, target selection w/ hysteresis, wall navigation) plus the state
  orchestration between them (watch -> chase -> break off -> return), with NO new mechanics and
  NO new tolerances. The controller reports each frame whom it is pursuing and how it moves
  (on_tick(state) -> {"move", "chasing"}); the judge recomputes the authoritative visibility
  truth from the guard's CURRENT position (gray zones included) and asserts the full patrol
  story black-box. Every FAIL carries "broken_link" (line_of_sight | target_selection |
  move_navigation | engagement | return | completion). Re-judged across a baseline scenario and
  hand-designed hidden scenarios (one armed axis each) × seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  line_of_sight:
    press: {line_of_sight: wall_between}
    seeds: [1, 2, 3, 4, 5]
  target_selection:
    press: {target_selection: close_contest}
    seeds: [1, 2, 3, 4, 5]
  full_press:
    press: {line_of_sight: wall_between, target_selection: close_contest}
    seeds: [1, 2, 3]
  ramp_cross:
    press: {target_selection: ramp_cross}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
