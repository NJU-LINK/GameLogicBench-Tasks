name: atom_dodge_hold
kind: atom
description: >
  Behavior task (dodgeball: dash-commitment discipline under throw fakes): drive a dodger — a
  circle confined to a narrow vertical lane that moves ONLY by dashing (an irreversible slide in
  one locked direction, then a cooldown before it can dash again) — through a deterministic throw
  drill. Each physics frame the judge feeds the controller the world state (dodger pose/lane/dash
  readiness, the dodge line, ball position+velocity, thrower position/facing/phase) and the
  controller returns on_tick(state) -> {"dash": int} (-1 up / +1 down / 0 hold; a new dash fires
  only when ready). The judge authoritatively drives the thrower through dribble/wind-up/throw
  events — wind-ups are sometimes pulled back (feints, aim readable from thrower_facing) before the
  real throw — and each thrown ball is a flat horizontal drive aimed at the dodger's y AT THE
  MOMENT that wind-up began, ruling a HIT when the ball meets the dodger's body (continuous
  per-frame closest approach, no tunnelling) and a DODGE when the ball clears the dodge line
  untouched. Black-box observable only: at most one throw connects. Re-judged across hand-designed
  hidden scenarios x seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  feint_hold:
    seeds: [1, 2, 3, 4, 5]
  double_feint:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
