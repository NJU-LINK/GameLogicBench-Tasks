name: combo_boss
kind: combo
description: >
  COMPOSED behavior task (full boss fight): the controller returns a full intent each frame
  (on_tick(state) -> {"move","target","attack","death_ack"}); the judge evolves threats, lands
  scripted counterblows (stagger + damage; the lethal chain kills the boss), integrates and
  asserts every rule black-box (lock quality / walls / range+cooldown pacing / stagger
  discipline / clean one-ack death). Every FAIL carries "broken_link" — press axes and
  broken_link share one vocabulary. Re-judged across a baseline and hidden scenarios.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  fast_tick:
    press: {time_base: fast_tick}
    seeds: [1, 2, 3]
  weapon_drift:
    press: {weapon_drift: redraw_on_hit}
    seeds: [1, 2, 3]
  pocket_door:
    press: {move_navigation: pocket_door}
    seeds: [1, 2, 3]
  pocket_x_stagger:
    press: {move_navigation: pocket_door, stagger_hold: mid_detour}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
