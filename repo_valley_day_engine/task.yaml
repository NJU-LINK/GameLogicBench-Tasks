name: repo_valley_day_engine
kind: repo
description: >
  REAL-REPO producer task (round-12, b form: hollow-and-reimplement). The agent works inside Valley
  Claim (godot-hex-sim-1, David Spencer, MIT, Godot 4.4) -- a turn-based frontier homestead survival
  sim on a hex map: a household claims land, marks work zones and fields, ends the day, and the day is
  worked and resolved (crops grow, food/water are eaten, family health is judged). The upstream ships
  a complete per-day settlement engine folded into GameState; the task version FACTORS it out into
  res://scripts/systems/day_engine.gd (a DayEngine class GameState owns and delegates the whole day to)
  and HOLLOWS it, and the agent reimplements it from a work-order spec. The deliverable is the engine
  that runs a day:
    work_today()            -- spend the one shared labour pool on the work zones (in ZONE_PRIORITY)
                               and then the fields (labour left over); a chore fires only once its hex
                               has accumulated its full cost.
    _resolve_day()          -- the seven-step fixed resolve: grow crops (frost x hardiness x tend,
                               drought stall), the family's own actions, household consumption
                               (accumulator + food-spend priority), family-health verdict (stacking
                               penalties, death), roll weather, CLEAR each zone's accumulated work,
                               refresh the labour pool.
  What is tested is IMPLEMENTING A REAL DAY-SETTLEMENT ENGINE: a single shared labour pool drained by
  priority across two armed systems (work zones + fields) and a survival conservation network -- a
  build single-day gate (work cleared nightly, so 8 labour must land in ONE day), a frost x hardiness x
  tend crop matrix, a food-spend accumulator, and a seven-step resolve ordering. The judge is the
  DRIVER: it builds a FIXED hex world (bypassing MapGenerator), seeds the rng, queues a fixed chore
  script of zones + fields through GameState's OWN methods, and drives whole days through the game's OWN
  verb (TurnManager.end_turn -> work_today -> _resolve_day -> refresh_labor). It asserts BLACK-BOX on
  world-observable quantities only (the resources ledger, labor_pool, the day a structure appears, field
  growth_days / emptiness, person.health / alive) -- never on module return values.

scenarios:
  baseline:
    seeds: [1, 2, 3]
  water_contention:
    press: {pool_order: water_contention}
    seeds: [1, 2, 3]
  build_singleday:
    press: {build_gate: build_singleday}
    seeds: [1, 2, 3]
  frost_matrix:
    press: {field_matrix: frost_matrix}
    seeds: [1, 2, 3]
  harvest_starve:
    press: {harvest_gate: harvest_starve}
    seeds: [1, 2, 3]
  consume_order:
    press: {consume_ledger: consume_order}
    seeds: [1, 2, 3]
  vitality_stack:
    press: {vitality: vitality_stack}
    seeds: [1, 2, 3]
  thirst_death:
    press: {vitality: thirst_death}
    seeds: [1, 2, 3]
  famine_harvest:
    press: {pool_order: water_contention, harvest_gate: harvest_starve}
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://scripts/systems/day_engine.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 960
    height: 640
