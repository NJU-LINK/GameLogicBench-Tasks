name: repo_youtd2_attack_cycle
kind: repo
description: >
  REAL-REPO producer task (b 挖空重实现). The agent works inside YouTD 2 (MIT code, Godot 4.4
  native, ~735 .gd — the largest codebase in the pool), a finished lockstep-deterministic tower-
  defense game, and rebuilds its TOWER ATTACK CYCLE ENGINE: res://src/towers/tower.gd
  (class_name Tower extends Unit, 1273 lines upstream). This is the per-tick engine that decides,
  every game tick, whether a tower may fire, which creeps in range it targets, how a multishot
  attack is distributed across N targets, when it goes back on cooldown, and how a bounce attack
  chains from creep to creep. Six mechanic-bearing methods are excavated to behavior-visible stubs
  (update() attack clock, _try_to_attack() multishot set loop, _attack_target() single attack +
  event reentry, _update_target_list() spatial target selection + priority sort, _get_next_bounce_
  target() bounce proximity chain, and the three _on_projectile_target_hit_normal/splash/bounce
  hit-settlement handlers); the surrounding scaffolding (constructor _ready, @export node refs,
  getters/setters, get_current_attack_speed(), get_target_count(), make(), the public API
  is_in_combat()/get_current_target()/order_stop()/issue_target_order()/force_attack_target())
  stays as frozen given code. What is tested is the L2 attack-cycle contract — the attack cooldown
  cadence, the multishot set semantics (per-series dedup + target-count quota), the spatial target
  selection (AttackTargetSorter: spawn_level -> distance -> uid, "finish the older wave first"),
  and the bounce chain (nearest-unvisited jumps, visited-not-revisited, bounce-count cap). CSV
  numbers (multishot / bounce / attack cd / range) and the priority-sort key are a READING WALL
  (L3 difficulty source), never spelled out. The judge instantiates the real game_scene.tscn,
  drives a fixed judge-authoritative build (research element -> build multishot / bounce towers),
  runs full matches with unlimited_portal_lives so leak never ends a match, and asserts BLACK-BOX
  on world-observable attack behavior: it connects each tower's attack + dealt_damage signals and
  each creep's attacked signal (all synchronous, tick-exact) and reconstructs, per attack series,
  the set of targets hit, the launch-time in-range snapshot, and the bounce hop chain. Scoring
  never reads lives/waves-cleared. Public baseline uses a single sparse wave so the naive stays
  correct; hidden scenarios arm cooldown pressure / high multishot / dense single-wave selection /
  deep bounce / two-wave overlap as UNANNOUNCED-BUT-LEGAL calling patterns, each arming exactly one
  contract family (overlap_waves arms two: multishot_set + target_priority, per-axis double probe).

scenarios:
  baseline:
    seeds: [1, 2]
  cadence_stress:
    seeds: [1, 2, 3]
  multishot_wide:
    seeds: [1, 2, 3]
  target_dense:
    seeds: [1, 2, 3]
  bounce_deep:
    seeds: [1, 2, 3]
  overlap_waves:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 300
    kill_after: 15
    wall: 330
  deliverable_paths:
    - res://src/towers/tower.gd

solve:
  resources:
    cpus: 4
    memory: 12g
    pids_limit: 2048
