name: repo_dothop_move_engine
kind: repo
description: >
  REAL-REPO producer task (round-11 repo producer wave, "b — hollow out and re-implement" form).
  The agent works inside a small Godot 4.4 grid-hop puzzle whose rule engine is vendored from
  russmatney/dothop (MIT) and delivers the MOVE RULE ENGINE — the callee the game drives to resolve
  one hop. The vendored world (PuzzleState) is kept as a pure DATA MODEL: it holds the board (a grid
  of cells with dots / collected dots / a goal / hoppers / undo markers) and the hoppers, and exposes
  geometry queries and primitive "set a cell's contents" mutations, but NO rules of motion. The rules
  are hollowed out into res://engine/move_engine.gd (move/check_win present, bodies empty): how a hop
  slides to the first un-collected dot and hops over collected ones, how a dot is consumed, the goal
  freeze, undo rewind (restore the dot collected on the rewound move), joint multi-hopper arbitration
  (one direction drives every hopper), and the win judgment. What is being tested is IMPLEMENTING A
  MECHANISM (a grid-hop transition function + reversible history + joint arbitration + win predicate).
  The judge drives a FIXED move script through the delivered engine over the vendored world and
  asserts BLACK-BOX on observable world state only — the per-step dotted/goal board, every hopper's
  coord + stuck flag, and the win field — comparing it step-for-step against its own trusted oracle
  (a frozen copy of the upstream rule set); it never reads the engine's return values or runs isolated
  unit tests. Scenario axis = the exercised mechanic (hop_slide / undo_rewind / goal_freeze /
  two_player_sync); seeds re-orient the hand-designed board AND the driving script by a dihedral
  element that preserves the whole observable trajectory.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  hop_slide:
    seeds: [1, 2, 3]
  undo_rewind:
    seeds: [1, 2, 3]
  goal_freeze:
    seeds: [1, 2, 3]
  two_player_sync:
    seeds: [1, 2, 3]
  trail_crossing:
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://engine/move_engine.gd
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 1024

solve:
  resources:
    cpus: 2
    memory: 4g
    pids_limit: 1024
