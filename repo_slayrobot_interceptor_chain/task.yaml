name: repo_slayrobot_interceptor_chain
kind: repo
description: >
  REAL-REPO producer task (b — hollow-and-reimplement). The agent works inside "Slay the Robot", a
  Godot 4 Slay-the-Spire-style deckbuilder framework (MIT; upstream notes in README_UPSTREAM.md),
  and reimplements the ACTION INTERCEPTOR CHAIN — the processor that stands between an action (an
  attack) and its resolution and lets registered interceptors (status effects like Vulnerable,
  Weakness, Damage-Increase, Negate-Damage) modify or veto that action before it lands. The upstream
  ships ~20 concrete interceptors, the interceptor data table (priorities + a parent/target flag +
  which actions each intercepts), the registration path, and the BaseAction / BaseCombatant pipeline
  that calls the processor — ALL INTACT. Only the processor
  (res://scripts/action_interceptors/ActionInterceptorProcessor.gd) is hollowed to a stub. The
  behavior contract (how the chain is assembled from the parent's and target's registered
  interceptors, ordered by priority, threaded through a shared shadow-value layer, and accepted /
  stopped / rejected) is NOT in the README — it must be reconstructed from the intact surrounding
  code (the reading wall). The judge drives real ActionAttack actions through the game's own
  ActionHandler queue with the delivered processor wired in and asserts BLACK-BOX on observable
  battle state only — health the enemy loses and its block after each scripted attack — never on the
  processor's internals or return values. Every FAIL carries a broken_link localising the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  chain_order:
    seeds: [1, 2, 3]
  gather_split:
    seeds: [1, 2, 3]
  negate_flow:
    seeds: [1, 2, 3]
  shadow_thread:
    seeds: [1, 2, 3]
  ignored_gate:
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://scripts/action_interceptors/ActionInterceptorProcessor.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 300

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048
