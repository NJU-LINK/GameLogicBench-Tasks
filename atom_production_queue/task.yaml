name: atom_production_queue
kind: atom
description: >
  Behavior task (RTS macro: production queue): manage the production queue of a single factory
  building. Each physics frame the judge feeds the controller the current world state plus any
  order events for that frame (enqueue item_kind / cancel_head); the controller returns
  on_tick(state) -> {"accept": [...], "produce": [...]} — which orders it accepts (charging the
  price up front, refunding cancels in full, rejecting when the 5-slot queue is full or funds are
  short) and which finished units it releases this frame. The judge asserts black-box observables
  only: released units must appear on the field at legal non-overlapping spots beside the factory,
  their release times must match the serial prefix-sum schedule t_i = sum(T_j, j<=i) of the queue,
  and the resource ledger must balance at every frame (charge on accept, refund on cancel, no
  charge on reject). Re-judged across hand-designed scenarios x seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  same_frame_spend:
    seeds: [1, 2, 3, 4]
  refund_reuse:
    seeds: [1, 2, 3, 4]
  slow_tick:
    seeds: [1, 2, 3, 4]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
