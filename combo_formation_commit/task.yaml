name: combo_formation_commit
kind: combo
description: >
  COMPOSED behavior task (auto-battler pre-battle formation commitment). The controller is asked
  ONCE, before the fight: it reads the opposing roster (types, stats, placements) plus its own
  unit pool, and returns a full formation — one deploy cell per unit. Then the battle resolves
  entirely on its own, tick by tick, under fixed disclosed unit-AI rules (nearest-target
  melee/ranged, speed-0 sentinels, density-seeking splash casters, weakest-hunting divers); the
  controller has NO say once combat starts. The emergent-correct plan reads the opposing
  composition and lays a counter-formation (front the rush, seal the divers' prey, spread against
  splash); a single memorised layout cannot satisfy all opposing shapes. The judge validates the
  placement, auto-runs the battle in a deterministic integer-grid simulation, and asserts
  SATISFICING consequence bounds black-box — win the field, keep at least the scenario's survivor
  floor, and bring the ranged killers through alive — never a unique best formation. Every FAIL
  carries "broken_link" localizing the causal break.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  knight_flood:
    press: {engagement_mass: knight_flood}
    seeds: [1, 2, 3]
  assassin_pair:
    press: {backline_dive: assassin_pair}
    seeds: [1, 2, 3]
  assassin_pair_wide:
    press: {backline_dive: assassin_pair_wide}
    seeds: [1, 2, 3]
  twin_mage:
    press: {aoe_density: twin_mage}
    seeds: [1, 3, 4]
  mixed_arms:
    press: {backline_dive: assassin_pair, aoe_density: twin_mage}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
