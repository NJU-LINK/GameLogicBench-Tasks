name: combo_escort_tow
kind: combo
description: >
  COMPOSED behavior task (escort tow under mid-run re-planning) — a LEADER (controller-steered) must
  deliver a slower STRAGGLER to the exit. The straggler is a DUMB follower: every frame it walks
  STRAIGHT at the leader's current position (no pathfinding, no wall awareness), so if the leader
  lets a wall fall on the straight tether between them it drags the straggler into the wall. The
  controller returns only the leader's move direction (decide(state) -> Vector2); the judge
  integrates the leader, then the straggler, and asserts black-box: neither body may clip a wall and
  BOTH must reach the goal. Every FAIL carries "broken_link" (move_navigation | tether | completion).
  Re-judged across a baseline scenario and two hidden scenarios × seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  blind_corner:
    press: {tether: blind_corner}
    seeds: [1, 2, 3, 4, 5]
  pocket_tow:
    press: {move_navigation: pocket_door, tether: blind_corner}
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
