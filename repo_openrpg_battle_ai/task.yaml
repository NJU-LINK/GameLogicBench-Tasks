name: repo_openrpg_battle_ai
kind: repo
description: >
  REAL-REPO integration task (round-10 repo expansion, first of the wave). The agent works inside
  GDQuest's Godot Open RPG (MIT code, CC0 art, Godot 4.4 — the combat subsystem of a finished
  JRPG, src/combat/**) and delivers the party's COMBAT AI: a decision-maker that, each round,
  reads the live roster (who is alive, each battler's HP / speed / energy / available actions) and
  caches an action + targets for every party member. What is being tested is READING AND
  INTEGRATING WITH A REAL COMBAT ENGINE — the round loop is the game's own two-phase scheduler
  (src/combat/combat.gd: PHASE 1 every battler selects an action, PHASE 2 they act in order of the
  highest CURRENT speed, re-sorted every turn via Battler.sort). The implicit conventions an AI
  must read the code to honor: (1) an action's target binds at selection but executes later against
  cached_targets[0] with NO liveness recheck (battler_action_attack.execute) — a faster ally can
  leave a slower ally swinging at a corpse; (2) a stats action (battler_action_modify_stats) is a
  PERMANENT, never-expiring modifier — a debuffer compounds; (3) energy only ever decreases
  (Battler.act subtracts it, nothing restores it) — a one-time budget. There is NO nameable
  textbook solver: a controller only performs as well as its author understood the engine. The
  judge builds the real Battler / BattlerRoster / BattlerAction objects, drives the game's own loop
  headless (Engine.time_scale compresses the animation waits), and SCORES the runtime-semantics
  contracts the combat code enforces, read off the engine's own settlement point (never source): a
  party attack must not execute against a target already dead at its turn (the engine binds
  cached_targets[0] with no liveness recheck -> struck_corpse / broken_link corpse_target), and a
  costed action must not be spent on a target an owned free strike already one-shots (energy only ever
  decreases: a wasted one-time budget -> energy_overspend / broken_link energy_budget). The battle
  OUTCOME (enemy roster cleared, party survivors floor, round budget) is a downstream validity GATE,
  checked only after the contracts hold — never frames / wall-clock. Scenario axis = encounter shape x
  pass thresholds; seeds jitter HP inside safe bands that never flip a kill.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  kill_order:
    seeds: [1, 2, 3]
  round_wipe:
    seeds: [1, 2, 3]
  buff_race:
    seeds: [1, 2, 3]
  energy_starve:
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 1024

solve:
  resources:
    cpus: 2
    memory: 4g
    pids_limit: 1024
