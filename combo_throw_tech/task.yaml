name: combo_throw_tech
kind: combo
description: >
  COMPOSED behavior task (fighting-game grappling) — a throw subsystem with coupled mechanisms
  resolved authoritatively by the judge: SAME-FRAME ARBITRATION (throw vs throw = trade, throw vs
  strike = strike wins, strike vs strike = clash — an explicit priority table, order-independent),
  GRAB / THROW (a connecting throw grabs a fighter that cannot defend, holds it, then throws it),
  a SYMMETRIC TECH (a grab only holds a fighter that cannot tech: a grab you land on a ready opponent
  is teched out just as a grab on you is techable), and a TECH WINDOW nested inside a LOCKOUT (escape
  a grab with a single tech inside a brief window; every press arms a lockout, so mashing burns the
  window). The controller returns on_tick(state) -> {"action": throw|strike|tech|none}; the judge
  arbitrates, resolves grabs both ways, drives the tech/lockout clocks and asserts the full match
  end-to-end from positions / hp / event timing. Every FAIL carries "broken_link" localizing the
  causal break. Re-judged across hand-designed scenarios x seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  same_frame:
    press: {same_frame: priority_trade}
    seeds: [1, 2, 3]
  swap:
    press: {same_frame: swap}
    seeds: [1, 2, 3]
  commit_contest:
    press: {same_frame: commit_contest}
    seeds: [1, 2, 3]
  grab_tech:
    press: {grab_tech: live_escape}
    seeds: [1, 2, 3]
  grab_lockout:
    press: {grab_tech: live_escape, throw_tech: lockout}
    seeds: [1, 2, 3]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
