name: repo_abyssal_enemy_engine
kind: repo
description: >
  REAL-REPO producer task (b — hollow-and-reimplement). The agent works inside "Abyssal Walker", a
  Godot 4 top-down action RPG (MIT; upstream notes in README_UPSTREAM.md), and reimplements the ENEMY
  BEHAVIOUR DECISION LAYER that lives on an enemy body — the per-frame decision entry point, the
  basic-attack clock's construction and its firing instant, the telegraph (wind-up) life cycle for a
  boss's heavy abilities, the release of a telegraphed charge, and the two distance bands the enemy
  steers by. The upstream ships everything the layer talks to — the five `_use_*_ability()`
  implementations with their reach gates and dash force, the projectile launcher, the ability pickers
  with all their randf draws, the telegraph duration table, the `_draw_*_telegraph()` painters, the
  damage / status / elite / boss-phase layers, the data table and the spawner that assigns twenty-odd
  public fields from it — ALL INTACT. Only ten method bodies of
  res://scripts/entities/enemies/enemy_base.gd are hollowed to stubs; signatures and member names are
  kept. The behaviour contract (which frame's world reading a delayed action consumes, whether a clock
  advances while the body is in a suspended mode, when the enemy stops closing, and how attack
  decision instants space out) is NOT in the README — it must be reconstructed from the intact
  surrounding code, most of which solves the same problems on the player's side of the same repo (the
  reading wall). The judge runs the delivered layer for 3600 physics frames against a fully scripted
  ghost player under --fixed-fps 60, and asserts BLACK-BOX on world observables only — node positions
  per physics frame, EventBus signals, the frozen StatusController's public is_frozen(), and the
  callbacks the scripted player and the enemy's parent host receive — never a field of the module.
  Every FAIL carries a broken_link naming the contract that broke.

scenarios:
  baseline:
    seeds: [1, 2, 5, 6, 7]
  ranged_spacing:
    seeds: [1, 6, 7]
  ranged_spacing_far:
    seeds: [1, 6, 7]
  short_reach:
    seeds: [1, 6, 7]
  windup_cadence:
    seeds: [1, 6, 7]
  commit_under_freeze:
    seeds: [1, 6, 7]
  commit_under_freeze_short:
    seeds: [1, 6, 7]
  band_reentry:
    seeds: [1, 6, 7]

judge:
  deliverable_paths:
    - res://scripts/entities/enemies/enemy_base.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 300
    kill_after: 15
    wall: 360

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048
