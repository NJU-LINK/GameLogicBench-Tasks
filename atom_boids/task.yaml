name: atom_boids
kind: atom
description: >
  Behavior task (planning: boids flocking / continuous group follow): keep a group of units moving
  together as a FLOCK that follows a shared moving anchor. The game instantiates ONE controller per
  unit; each physics frame every unit's controller returns a VELOCITY (on_tick(state) -> Vector2)
  and the judge integrates all units together. The judge asserts black-box observables only, over
  1 s windows after a warm-up (never reading a controller): two bodies interpenetrating beyond a
  small tolerance FAILS (overlap); the flock dispersing past a size-scaled cohesion bound FAILS
  (scatter); the group centroid lagging the anchor beyond a bound FAILS (follow_lag); a unit leaving
  the arena FAILS (out_of_bounds). Alignment is NOT asserted directly (turning windows have high
  heading variance) — it emerges from following + cohesion + non-overlap. Re-judged across
  hand-designed hidden scenarios × seed perturbation — the OOD axis.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  scale_up:
    seeds: [1, 2, 3, 4, 5]
  sharp_turns:
    seeds: [1, 2, 3, 4, 5]
  chokepoint:
    seeds: [1, 2, 3, 4, 5]
  corner_dwell:
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256

record:
  window:
    width: 960
    height: 640
