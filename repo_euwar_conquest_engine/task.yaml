name: repo_euwar_conquest_engine
kind: repo
description: >
  REAL-REPO producer task (round-12, b form: hollow-and-reimplement). The agent works inside
  EU-War (MIT, Godot 4 -- a complete tactical hex wargame of European warfare with a multi-power
  grand-strategy CONQUEST layer on top: a strategic map of cities and resource nodes, several
  great powers, supply chains, treasuries, deterministic auto-resolved battles and eliminations).
  The upstream ships a complete round-SETTLEMENT engine inside its 1133-line GameState autoload;
  the task version EXTRACTS it into a leaf module and HOLLOWS it out, and the agent reimplements
  it from a work-order spec. The deliverable is res://scripts/scenario/conquest_engine.gd -- the
  strategic round's settlement logic: supply-gated INCOME settlement for every power, SIX treasury
  sinks (muster / fortify / develop / prepare / recruit / heal) spending one shared balance behind
  exact gates, caps and an idempotency lock, the rival powers' EXPANSION turn (arm-first treasury
  spend, a margin-gated target pick under a strict [margin, city-first, lowest-id] order, attacks
  on the player QUEUED for a tactical defence, attacks on anyone else resolved deterministically),
  the all-integer local-strength AUTO-RESOLVE whose ties hold for the defender, the FIXED ROUND
  ORDER (rivals act, then income, then flag resets, then victory), the difficulty ladder scaling
  the rivals, and the ELIMINATION/INHERITANCE chain. GameState keeps the strategic state and the
  frozen world rules (territory tables, the supply network, attackability, battle setup,
  persistence) and delegates settlement to the agent's engine. The judge injects hand-designed
  conquest datasets into the game's own DataLoader, starts a REAL conquest through GameState,
  drives it round by round through the game's own verbs (advance_conquest_round, the sink verbs,
  begin_conquest_defense + resolve_conquest_battle) and diffs EVERY world observable
  (conquest_strength / treasury / owner / power_army / fortify / defense_queue / last_round_log /
  eliminated / result / round flags) against an INDEPENDENT shadow oracle it recomputes itself --
  the engine's return values are never scored (the "reads the module through the world" rule).
  The conquest layer is RNG-free integer logic, so runs are bit-identical.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  supply_cut:
    press: {income_ledger: supply_cut}
    seeds: [1, 2, 3]
  sink_drill:
    press: {sink_discipline: sink_drill}
    seeds: [1, 2, 3]
  timid:
    press: {expansion: timid}
    seeds: [1, 2, 3]
  winnable:
    press: {expansion: winnable}
    seeds: [1, 2, 3]
  assault_player:
    press: {defense_route: assault_player, expansion: assault_player}
    seeds: [1, 2, 3]
  tie_standoff:
    press: {autoresolve: tie_standoff, defense_route: tie_standoff, expansion: tie_standoff}
    seeds: [1, 2, 3]
  siege_x_cut:
    press: {income_ledger: supply_cut, expansion: timid, defense_route: assault_player}
    seeds: [1, 2, 3]

judge:
  deliverable_paths:
    - res://scripts/scenario/conquest_engine.gd
  resources:
    cpus: 1
    memory: 2g
    pids_limit: 1024
  timeout:
    container: 240
    kill_after: 15
    wall: 270

solve:
  resources:
    cpus: 4
    memory: 8g
    pids_limit: 2048

record:
  window:
    width: 1280
    height: 720
