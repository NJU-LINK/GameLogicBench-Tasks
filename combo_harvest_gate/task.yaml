name: combo_harvest_gate
kind: combo
description: >
  COMPOSED behavior task (crowded mine) — two open-rts economy rings joined into one harvest
  story: the HARVEST/HAUL loop (a worker shuttles ore from a mine to the command center — move
  to a mine, collect one unit at a time, carry a load home, deposit, repeat; migrate to another
  mine when one runs dry) and the PASSIVE-SHOVE gate (a worker shoved off its spot by a passing
  hauler must suspend its collect rhythm — no progress while displaced, no harvesting through a
  shove that ejected it from reach). The world is pure logic (worker positions integrated by
  hand, no physics body, no navigation server) and the haulers ride analytic straight-line paths
  for bit-level determinism. Each worker runs ONE controller instance returning
  {"move", "commit", "deposit"} each frame; the judge owns the authoritative mine stocks, worker
  loads, player-ore ledger and per-worker earned-collect clock, and asserts BLACK-BOX — it reads
  the behavioral CONSEQUENCE of when a commit fires (adhered? a full unit earned? within
  capacity?), never a controller's own timer or state label. Every FAIL carries "broken_link"
  (harvest_loop | passive_gate | completion). Re-judged across a baseline scenario and
  hand-designed hidden scenarios (one armed axis each) x seed perturbation.

scenarios:
  baseline:
    seeds: [1, 2, 3, 4, 5]
  depletion:
    press: {harvest_loop: depletion}
    seeds: [1, 2, 3, 4, 5]
  crowded:
    press: {harvest_loop: crowded}
    seeds: [1, 2, 3, 4, 5]
  push_out_of_range:
    press: {passive_gate: push_out_of_range}
    seeds: [1, 2, 3, 4, 5]
  push_frequency:
    press: {passive_gate: push_frequency}
    seeds: [1, 2, 3, 4, 5]

judge:
  resources:
    cpus: 1
    memory: 1g
    pids_limit: 256
